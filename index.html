<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meowbot</title>
<link rel="icon" href="meowbot.png" type="image/png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;color:#111;background:#07ee7b;-webkit-font-smoothing:antialiased}

  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.active{display:flex}

  /* ===== CHAPTERS SCREEN ===== */
  #chaptersScreen{background:#07ee7b;color:#111;align-items:center;justify-content:center;gap:0;padding:32px;position:relative;overflow-y:auto}

  .cs-title{z-index:1;user-select:none;width:80%;max-width:900px;margin-bottom:-30px;pointer-events:none}
  .cs-title img{width:100%;height:auto;display:block}

  .cs-logo{display:flex;align-items:center;justify-content:center;z-index:1;margin-bottom:12px}

  .cs-streak{
    position:fixed;bottom:24px;left:24px;z-index:2;
    display:flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:#fff;
  }
  .cs-streak svg{color:#fff}
  .cs-streak .streak-num{font-weight:900;font-size:16px}

  .cs-days{
    position:fixed;bottom:24px;right:24px;z-index:2;
    font-size:13px;font-weight:700;color:#fff;
    display:flex;align-items:center;gap:6px;
  }
  .cs-days svg{color:#fff}
  .cs-days span{font-weight:900;font-size:16px}

  .cs-search-btn{
    position:fixed;top:24px;right:24px;z-index:2;
    background:rgba(0,0,0,.06);border:none;border-radius:100px;
    padding:8px 16px 8px 12px;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:500;color:rgba(0,0,0,.35);
    display:flex;align-items:center;gap:6px;transition:all .2s;
  }
  .cs-search-btn:hover{background:rgba(0,0,0,.1);color:rgba(0,0,0,.5)}

  .search-overlay{
    position:fixed;inset:0;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    z-index:200;display:flex;flex-direction:column;align-items:center;
    padding:80px 32px 32px;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .search-overlay.show{opacity:1;pointer-events:auto}
  .search-input{
    width:100%;max-width:500px;background:#f5f5f5;border:none;border-radius:14px;
    padding:16px 20px;font-size:17px;font-family:inherit;font-weight:500;
    color:#111;outline:none;margin-bottom:20px;
  }
  .search-input::placeholder{color:#bbb}
  .search-results{
    width:100%;max-width:500px;max-height:60vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:2px;
  }
  .search-item{
    background:none;border:none;cursor:pointer;font-family:inherit;
    padding:14px 16px;border-radius:12px;text-align:left;transition:background .15s;
  }
  .search-item:hover{background:#f5f5f5}
  .search-item .si-term{font-size:15px;font-weight:700;color:#111;margin-bottom:3px}
  .search-item .si-def{font-size:13px;color:#888;line-height:1.4}
  .search-item .si-sub{font-size:11px;color:#ccc;margin-top:2px}
  .search-close{
    position:fixed;top:24px;right:24px;z-index:210;
    background:#f0f0f0;border:none;border-radius:100px;
    width:36px;height:36px;cursor:pointer;font-size:18px;color:#999;
    display:flex;align-items:center;justify-content:center;transition:all .2s;
  }
  .search-close:hover{background:#e0e0e0;color:#111}
  .search-empty{font-size:14px;color:#ccc;margin-top:20px}

  .cs-chapters{display:flex;flex-direction:column;gap:6px;align-items:center;z-index:1}
  .cs-ch-card{
    background:none;border:none;cursor:pointer;
    transition:all .2s;display:flex;align-items:center;gap:10px;
    font-family:inherit;padding:6px 0;
  }
  .cs-ch-card:hover{opacity:.7}
  .cs-ch-card.empty{opacity:.3;cursor:default}
  .cs-ch-card.empty:hover{opacity:.3}
  .cs-ch-card .ch-num{font-size:15px;font-weight:700;color:rgba(255,255,255,.5);min-width:22px}
  .cs-ch-card .ch-name{font-size:22px;font-weight:700;color:rgba(255,255,255,.9)}

  /* Chapter detail screen */
  #chapterDetail{background:#fff;color:#111;align-items:center;justify-content:center;gap:0;padding:32px}
  .cd-back{
    position:fixed;top:24px;left:24px;background:#f5f5f5;border:none;
    border-radius:100px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#999;transition:all .2s;z-index:10;
    display:flex;align-items:center;gap:6px;
  }
  .cd-back:hover{background:#eee;color:#111}
  .cd-mascot{margin-bottom:24px}
  .cd-mascot video{width:120px;height:120px;object-fit:contain}
  .cd-title{font-size:28px;font-weight:800;color:#111;letter-spacing:-.5px;margin-bottom:6px}
  .cd-subtitle{font-size:14px;color:#bbb;font-weight:500;margin-bottom:32px}
  .cd-menu{
    display:flex;flex-direction:column;gap:0;
    background:#f8f8f8;
    border-radius:20px;overflow:hidden;min-width:300px;
  }
  .cd-menu-item{
    background:none;border:none;cursor:pointer;
    padding:18px 28px;font-family:inherit;font-size:15px;font-weight:600;
    color:#555;transition:all .15s;
    display:flex;align-items:center;gap:14px;text-align:left;
  }
  .cd-menu-item:hover{background:#f0f0f0}
  .cd-menu-item+.cd-menu-item{border-top:1px solid #eee}
  .cd-menu-item svg{color:#ccc;flex-shrink:0}
  .cd-menu-item .cd-sub{font-size:11px;font-weight:500;color:#bbb;margin-top:2px}
  .cd-marked-info{font-size:12px;color:#ccc;margin-top:12px}


  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ===== TERM SCREEN ===== */
  #termScreen{background:#ffffff;padding:32px 48px;flex-direction:column;align-items:center;justify-content:center;gap:0}

  .term-back{
    position:fixed;top:24px;left:24px;
    background:none;border:1.5px solid #e0e0e0;border-radius:100px;
    padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#999;transition:all .2s;z-index:10;
    display:flex;align-items:center;gap:6px;
  }
  .term-back:hover{border-color:#07ee7b;color:#07ee7b}

  .term-topright{
    position:fixed;top:24px;right:24px;
    display:flex;align-items:center;gap:10px;z-index:10;
  }
  .term-timer{font-size:15px;font-weight:600;color:#bbb;font-variant-numeric:tabular-nums;letter-spacing:-.3px;cursor:pointer}
  .term-timer.done{color:#07ee7b;animation:pulse 1s infinite}
  .tr-btn{
    background:#f5f5f5;border:none;border-radius:100px;
    padding:5px 14px;font-size:11px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#999;transition:all .15s;
  }
  .tr-btn:hover{background:#eee;color:#111}
  .tr-sep{width:1px;height:20px;background:#e8e8e8}
  .rot-pills{display:flex;gap:3px}
  .rot-pill{
    background:none;border:1px solid #ddd;border-radius:100px;
    padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#bbb;transition:all .15s;
  }
  .rot-pill:hover{color:#111;border-color:#999}
  .rot-pill.on{background:#111;color:#fff;border-color:#111}
  .rot-countdown{font-size:11px;font-weight:600;color:#bbb;font-variant-numeric:tabular-nums;min-width:28px}

  .mark-btn{
    background:none;border:none;cursor:pointer;
    color:#ddd;transition:all .2s;display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;font-size:20px;
  }
  .mark-btn:hover{color:#f5c518}
  .mark-btn.marked{color:#f5c518}

  .lang-btns{display:flex;gap:3px}
  .lang-btn{
    background:#f5f5f5;border:none;border-radius:100px;
    padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;
    font-family:inherit;color:#bbb;transition:all .15s;
  }
  .lang-btn:hover{background:#eee;color:#111}
  .lang-btn.on{background:#111;color:#fff}
  .notif-toggle{
    background:none;border:none;cursor:pointer;color:#bbb;
    transition:color .2s;display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;
  }
  .notif-toggle:hover{color:#111}
  .notif-toggle.active{color:#07ee7b}
  .term-nav{
    display:flex;gap:6px;
  }
  .term-nav button{
    background:#f5f5f5;border:none;border-radius:100px;
    width:36px;height:36px;cursor:pointer;font-family:inherit;
    color:#999;transition:all .15s;display:flex;align-items:center;justify-content:center;
  }
  .term-nav button:hover{background:#eee;color:#111}

  .term-left{display:flex;align-items:center;justify-content:center}
  .term-left img{max-width:200px;max-height:28vh;object-fit:contain;border-radius:16px}

  .term-right{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:600px}
  .term-chapter{
    position:fixed;bottom:32px;left:32px;z-index:10;
    font-size:12px;font-weight:500;color:#ccc;text-transform:uppercase;letter-spacing:1.2px;
  }
  .term-word{font-size:56px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px;color:#111}
  .term-def{font-size:26px;font-weight:400;line-height:1.65;color:#555}
  .term-meta{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .term-count{font-size:13px;color:#ccc;font-weight:500;font-variant-numeric:tabular-nums}
  .progress-track{width:160px;height:3px;background:#e8e8e8;border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:#07ee7b;border-radius:2px;transition:width .3s}

  .mascot-corner{
    position:fixed;bottom:48px;right:80px;z-index:10;
    width:140px;height:140px;
  }
  .mascot-corner img{width:100%;height:100%;object-fit:contain;display:block}
  .mascot-corner video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
  .mascot-corner video.playing{opacity:1}

  /* Overlays */
  .anim-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
  .anim-overlay.show{opacity:1;pointer-events:auto}
  .anim-overlay video{max-width:360px;max-height:360px;border-radius:24px}
  .anim-overlay.white{background:rgba(255,255,255,.97)}
  .anim-overlay.green{background:rgba(0,200,83,.97)}

  .green-overlay{position:fixed;inset:0;background:#00c853;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
  .green-overlay.show{opacity:1;pointer-events:auto}
  .green-overlay .green-title{color:#fff;font-size:32px;font-weight:800;margin-bottom:8px}
  .green-overlay .green-sub{color:rgba(255,255,255,.7);font-size:16px;font-weight:500;margin-bottom:32px}
  .green-overlay .green-dismiss{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:100px;padding:12px 32px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
  .green-overlay .green-dismiss:hover{background:rgba(255,255,255,.35)}

  /* Meditation mode */
  .med-btn{
    background:rgba(0,0,0,.08);border:none;border-radius:50px;
    padding:12px 32px;cursor:pointer;
    color:rgba(0,0,0,.45);font-family:inherit;font-size:14px;font-weight:600;
    transition:all .2s;letter-spacing:-.2px;
  }
  .med-btn:hover{background:rgba(0,0,0,.12);color:rgba(0,0,0,.6)}

  .med-overlay{
    position:fixed;inset:0;background:#111;z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .8s;
  }
  .med-overlay.show{opacity:1;pointer-events:auto}
  .med-term{font-size:48px;font-weight:700;color:#fff;margin-bottom:12px;text-align:center;
    opacity:0;transition:opacity .8s;max-width:80vw}
  .med-term.visible{opacity:1}
  .med-def{font-size:22px;font-weight:400;color:rgba(255,255,255,.5);line-height:1.6;
    text-align:center;max-width:700px;opacity:0;transition:opacity .8s .3s}
  .med-def.visible{opacity:1}
  .med-count{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
    font-size:13px;color:rgba(255,255,255,.2);font-variant-numeric:tabular-nums}
  .med-close{
    position:fixed;top:24px;right:24px;z-index:210;
    background:rgba(255,255,255,.1);border:none;border-radius:100px;
    padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;color:rgba(255,255,255,.5);transition:all .2s;
  }
  .med-close:hover{background:rgba(255,255,255,.2);color:#fff}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeUp .25s ease}

  @media (max-width:768px){
    /* Homepage */
    #chaptersScreen{padding:env(safe-area-inset-top,20px) 20px 60px;gap:6px}
    .cs-title{width:75%;margin-bottom:-5px}
    .cs-logo video{width:70px!important;height:70px!important}
    .cs-logo{margin-bottom:6px}
    .cs-ch-card .ch-name{font-size:16px}
    .cs-ch-card .ch-num{font-size:12px}
    .cs-search-btn{
      position:static;margin-bottom:8px;align-self:flex-end;
      padding:6px 14px 6px 10px;font-size:12px;
      background:rgba(255,255,255,.25);color:rgba(255,255,255,.7);
    }
    .cs-streak,.cs-days{bottom:12px;font-size:11px}
    .cs-streak{left:16px}
    .cs-days{right:16px}

    /* Chapter detail */
    .cd-back{top:env(safe-area-inset-top,16px);left:16px;padding:6px 14px;font-size:11px}
    .cd-mascot video{width:70px!important;height:70px!important}
    .cd-title{font-size:20px}
    .cd-subtitle{font-size:11px;margin-bottom:20px}
    .cd-menu{min-width:auto;width:90vw;max-width:340px}
    .cd-menu-item{padding:14px 18px;font-size:13px}
    .cd-menu-item svg{width:18px;height:18px}

    /* Term screen - two rows: top bar + content centered */
    #termScreen{padding:0 20px 60px;justify-content:center}
    .term-back{
      position:fixed;top:env(safe-area-inset-top,8px);left:12px;
      padding:6px 12px;font-size:10px;z-index:20;
    }
    .term-topright{
      position:fixed;top:env(safe-area-inset-top,8px);right:12px;
      gap:4px;z-index:20;flex-wrap:nowrap;
    }
    .lang-btn{padding:4px 8px;font-size:9px}
    .mark-btn{width:28px;height:28px;font-size:15px}
    .term-nav button{width:28px;height:28px}
    .term-nav button svg{width:14px;height:14px}
    .notif-toggle{width:28px;height:28px}
    .notif-toggle svg{width:16px;height:16px}
    .term-timer{font-size:11px}
    .tr-btn{padding:3px 8px;font-size:9px}
    .rot-pills,.rot-countdown,.tr-sep{display:none}

    .term-left img{max-width:100px;max-height:18vh}
    .term-word{font-size:26px;letter-spacing:-.6px}
    .term-def{font-size:15px;line-height:1.5;padding:0 8px}
    .term-meta{margin-top:10px}
    .progress-track{width:100px}
    .term-count{font-size:11px}

    .mascot-corner{width:60px;height:60px;bottom:8px;right:8px}
    .term-chapter{bottom:10px;left:12px;font-size:9px}

    /* Search */
    .search-overlay{padding:env(safe-area-inset-top,50px) 16px 16px}
    .search-input{font-size:16px;padding:14px 16px;border-radius:12px}
    .search-close{top:env(safe-area-inset-top,12px);right:16px}
    .search-item{padding:12px 14px}
    .search-item .si-term{font-size:14px}

    /* Meditation */
    .med-term{font-size:24px;max-width:90vw}
    .med-def{font-size:15px;max-width:90vw;padding:0 12px}
    .med-close{top:env(safe-area-inset-top,12px);right:16px;padding:8px 16px;font-size:12px}
    .med-count{font-size:11px;bottom:12px}

    /* Overlays */
    .anim-overlay video{max-width:200px;max-height:200px;border-radius:16px}
    .green-overlay .green-title{font-size:22px}
    .green-overlay .green-sub{font-size:13px}
  }

  @media (max-width:400px){
    .cs-title{width:85%}
    .term-word{font-size:22px}
    .term-def{font-size:14px}
    .term-left img{max-width:80px;max-height:15vh}
    .med-term{font-size:20px}
    .med-def{font-size:13px}
  }
</style>
</head>
<body>

<!-- CHAPTERS SCREEN (green) -->
<div class="screen active" id="chaptersScreen">
  <button class="cs-search-btn" onclick="openSearch()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Search
  </button>
  <div class="cs-title"><img src="meowbot-logo.png" alt="MEOWBOT"></div>
  <div class="cs-logo"><video id="csLogoVideo" muted playsinline autoplay loop style="width:140px;height:140px;object-fit:contain"></video></div>
  <div class="cs-streak" id="csStreak"></div>
  <div class="cs-chapters" id="csChapters"></div>
  <div class="cs-days" id="csDays"></div>
</div>

<!-- CHAPTER DETAIL (green) -->
<div class="screen" id="chapterDetail">
  <button class="cd-back" onclick="goHome()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>
  <div class="cd-mascot"><video id="cdMascotVideo" muted playsinline autoplay loop style="width:120px;height:120px;object-fit:contain"></video></div>
  <div class="cd-title" id="cdTitle"></div>
  <div class="cd-subtitle">Chapter 1</div>
  <div class="cd-menu">
    <button class="cd-menu-item" onclick="openChapter()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <div>Start learning<div class="cd-sub">Continue where you left off</div></div>
    </button>
    <button class="cd-menu-item" onclick="startMeditation('en')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      <div>Meditation EN<div class="cd-sub">English voice, 2x repeat</div></div>
    </button>
    <button class="cd-menu-item" onclick="startMeditation('sk')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      <div>Meditation SK<div class="cd-sub">Slovak voice, 2x repeat</div></div>
    </button>
    <button class="cd-menu-item" onclick="startMeditation('ensk')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      <div>Meditation EN + SK<div class="cd-sub">English then Slovak</div></div>
    </button>
    <button class="cd-menu-item" onclick="openMarked()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <div>Marked only<div class="cd-sub" id="markedCount">No terms marked yet</div></div>
    </button>
  </div>
</div>

<!-- Meditation overlay -->
<div class="med-overlay" id="medOverlay">
  <button class="med-close" onclick="stopMeditation()">Stop</button>
  <div class="med-term" id="medTerm"></div>
  <div class="med-def" id="medDef"></div>
  <div class="med-count" id="medCount"></div>
</div>

<!-- TERM SCREEN (white) -->
<div class="screen" id="termScreen">
  <button class="term-back" onclick="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Chapters
  </button>

  <div class="term-topright">
    <div class="lang-btns">

let termDispLang='en'; // current display language on term screen
let ti=0,rot=300,rotT=null,notif='sound';
let pTotal=25*60,pLeft=25*60,pRun=false,pT=null,actx=null;

function getImgIndex(){return ti;}

function ensureAudio(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}if(actx.state==='suspended')actx.resume();}
// Keep unlocking audio on every click (some browsers re-suspend)
document.addEventListener('click',()=>{ensureAudio();});

function beep(){
  ensureAudio();
  // First tone
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.frequency.value=800;o.type='sine';g.gain.value=0.5;
  g.gain.setValueAtTime(0.5,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+0.3);
  o.start(actx.currentTime);o.stop(actx.currentTime+0.3);
  // Second tone
  setTimeout(()=>{
    const o2=actx.createOscillator(),g2=actx.createGain();
    o2.connect(g2);g2.connect(actx.destination);
    o2.frequency.value=1200;o2.type='sine';g2.gain.value=0.5;
    g2.gain.setValueAtTime(0.5,actx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+0.3);
    o2.start(actx.currentTime);o2.stop(actx.currentTime+0.3);
  },200);
}
let voiceAudio=null;
let termAudioEl=null;
function playVoice(idx,lang){
  if(termAudioEl){try{termAudioEl.pause();}catch(e){}}
  const folder=lang==='sk'?'audio-sk':'audio';
  if(!termAudioEl){termAudioEl=new Audio();}
  termAudioEl.src=`${folder}/${String(idx).padStart(3,'0')}.mp3`;
  termAudioEl.load();
  termAudioEl.play().catch(()=>{});
}

  });
}
function playCurrentEN(){termDispLang='en';renderTerm();updateLangBtns();playVoice(getRealIdx(),'en');}
function playCurrentSK(){termDispLang='sk';renderTerm();updateLangBtns();playVoice(getRealIdx(),'sk');}

function doAlert(){
  if(notif==='sound'){
    try{ensureAudio();beep();}catch(e){}
    setTimeout(()=>{playVoice(getRealIdx());},500);
  }
  if(notif==='vibration'&&navigator.vibrate)navigator.vibrate([80,40,80]);
}

function playWhiteAnim(cb){
  const ov=document.getElementById('animWhite'),v=document.getElementById('animWhiteVideo');
  let finished=false;
  function done(){if(finished)return;finished=true;ov.classList.remove('show');if(cb)cb();}
  v.src=nextWhiteAnim();
  ov.classList.add('show');
  const p=v.play();
  if(p)p.catch(()=>{done();});
  v.onended=()=>{done();};
  v.onerror=()=>{done();};
  setTimeout(done,5000); // fallback
}
function playGreenAnim(cb){
  const ov=document.getElementById('animGreen'),v=document.getElementById('animGreenVideo');
  v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];ov.classList.add('show');v.play();
  v.onended=()=>{ov.classList.remove('show');if(cb)cb();};
}

function showPomodoroDone(){
  const ov=document.getElementById('pomodoroOverlay'),v=document.getElementById('pomodoroVideo');
  v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];ov.classList.add('show');v.play();
  v.onended=()=>{v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];v.play();};
}
function dismissPomodoro(){document.getElementById('pomodoroOverlay').classList.remove('show');document.getElementById('pomodoroVideo').pause();}

// Build chapter buttons (only chapters that have data)
const CHAPTERS=[
  {name:'Introduction to Robotics',hasContent:true},
  {name:'Coming soon',hasContent:false},
];
function buildChapters(){
  document.getElementById('csChapters').innerHTML=CHAPTERS.map((ch,i)=>
    ch.hasContent
      ? `<button class="cs-ch-card" onclick="openChapterDetail(${i})"><span class="ch-num">Chapter ${i+1}</span><span class="ch-name">${ch.name}</span></button>`
      : `<div class="cs-ch-card empty"><span class="ch-num">Chapter ${i+1}</span><span class="ch-name">${ch.name}</span></div>`
  ).join('');
}
function openChapterDetail(i){
  document.getElementById('cdTitle').textContent=CHAPTERS[i].name;
  updateMarkedCount();
  // Loop white anims on chapter detail mascot
  const v=document.getElementById('cdMascotVideo');
  let wi=0;
  function nextW(){v.src=whiteAnims[wi%whiteAnims.length];wi++;v.play().catch(()=>{});}
  v.onended=nextW;nextW();
  document.getElementById('chaptersScreen').classList.remove('active');
  document.getElementById('chapterDetail').classList.add('active');
}
function goHome(){
  document.getElementById('chapterDetail').classList.remove('active');
  document.getElementById('chaptersScreen').classList.add('active');
  updateStreak();
}

// Mascot: sits still, occasionally plays animation
let mascotIdx=0,mascotTimer=null;
function startMascot(){
  scheduleMascotAnim();
}
function scheduleMascotAnim(){
  const delay=8000+Math.random()*15000; // 8-23 seconds
  mascotTimer=setTimeout(()=>{
    const v=document.getElementById('mascotVideo');
    v.src=whiteAnims[mascotIdx%whiteAnims.length];
    mascotIdx++;
    v.classList.add('playing');
    v.play();
    v.onended=()=>{v.classList.remove('playing');scheduleMascotAnim();};
  },delay);
}
function stopMascot(){
  if(mascotTimer)clearTimeout(mascotTimer);
  const v=document.getElementById('mascotVideo');
  v.pause();v.classList.remove('playing');v.onended=null;
}

// Wake Lock - prevent screen sleep
let wakeLock=null;
async function requestWakeLock(){
  try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){try{wakeLock.release();}catch(e){} wakeLock=null;}
}

function openChapter(){
  ensureAudio();
  requestWakeLock();
  if(!termAudioEl){termAudioEl=new Audio();}
  termAudioEl.src='audio/000.mp3';termAudioEl.play().then(()=>termAudioEl.pause()).catch(()=>{});
  markStudied();
  markedMode=false;
  const saved=localStorage.getItem('meowbot-ti');
  ti=saved?parseInt(saved):0;
  if(ti>=TERMS.length)ti=0;
  document.getElementById('chapterDetail').classList.remove('active');
  document.getElementById('termScreen').classList.add('active');
  renderTerm();
  resetRot();
  startMascot();
}

function goBack(){
  if(rotT)clearInterval(rotT);
  stopMascot();
  releaseWakeLock();
  document.getElementById('termScreen').classList.remove('active');
  document.getElementById('chapterDetail').classList.add('active');
}

function getRealIdx(){return markedMode?markedList[ti]:ti;}
function getTotal(){return markedMode?markedList.length:TERMS.length;}

function renderTerm(){
  const ri=getRealIdx();
  const [t,d,sub,imgIdx]=TERMS[ri];
  if(!markedMode)localStorage.setItem('meowbot-ti',ti);
  const r=document.getElementById('termRight');
  r.classList.remove('fade');void r.offsetWidth;r.classList.add('fade');
  document.getElementById('termCh').textContent=sub;
  document.getElementById('termImg').src='img/'+IMGS[imgIdx];
  if(termDispLang==='sk'&&TERMS_SK[ri]){
    document.getElementById('termWord').textContent=TERMS_SK[ri][0];
    document.getElementById('termDef').textContent=TERMS_SK[ri][1];
  }else{
    document.getElementById('termWord').textContent=t;
    document.getElementById('termDef').textContent=d;
  }
  document.getElementById('termCount').textContent=`${ti+1} / ${getTotal()}`;
  document.getElementById('termProg').style.width=`${((ti+1)/getTotal())*100}%`;
  updateMarkBtn();
}

function nextTerm(){ti=(ti+1)%getTotal();renderTerm();doAlert();resetRot();}
function prevTerm(){ti=(ti-1+getTotal())%getTotal();renderTerm();doAlert();resetRot();}
function autoNext(){
  ti=(ti+1)%getTotal();
  doAlert();
  playWhiteAnim(()=>{renderTerm();});
}
let rotLeft=300,rotTick=null;
function fmtRot(s){const m=Math.floor(s/60),sec=s%60;return sec>0?`${m}:${String(sec).padStart(2,'0')}`:`${m}:00`;}
function resetRot(){
  if(rotT)clearInterval(rotT);if(rotTick)clearInterval(rotTick);
  rotLeft=rot;
  document.getElementById('rotCountdown').textContent=fmtRot(rotLeft);
  rotTick=setInterval(()=>{rotLeft--;document.getElementById('rotCountdown').textContent=fmtRot(Math.max(0,rotLeft));},1000);
  rotT=setInterval(()=>{rotLeft=rot;autoNext();},rot*1000);
}

function setNotif(m){notif=m;updateNotifIcon();if(m==='sound')beep();if(m==='vibration'&&navigator.vibrate)navigator.vibrate(80);}
function cycleNotif(){const modes=['none','sound','vibration'];notif=modes[(modes.indexOf(notif)+1)%3];setNotif(notif);}
function updateNotifIcon(){const on=notif!=='none';document.getElementById('notifIconOff').style.display=on?'none':'block';document.getElementById('notifIconOn').style.display=on?'block':'none';document.getElementById('notifToggle').classList.toggle('active',on);document.getElementById('notifToggle').title=notif==='none'?'Alerts off':notif==='sound'?'Sound on':'Vibrate on';}
function setRot(s){rot=s;document.querySelectorAll('.rot-pill').forEach(b=>b.classList.toggle('on',+b.dataset.i===s));if(rotT)resetRot();}

function fmt(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
const timerPresets=[10,15,25,30,45,60];let tpIdx=2;
function cycleTimerPreset(){if(pRun)return;tpIdx=(tpIdx+1)%timerPresets.length;setTimer(timerPresets[tpIdx]);}
function setTimer(m){pTotal=m*60;pLeft=m*60;pRun=false;if(pT)clearInterval(pT);document.getElementById('startBtn').textContent='Start';document.getElementById('termTimer').classList.remove('done');document.getElementById('termTimer').textContent=fmt(pLeft);}
function toggleTimer(){
  if(pRun){pRun=false;clearInterval(pT);document.getElementById('startBtn').textContent='Start';}
  else{pRun=true;document.getElementById('startBtn').textContent='Pause';
    pT=setInterval(()=>{pLeft--;document.getElementById('termTimer').textContent=fmt(pLeft);
      if(pLeft<=0){clearInterval(pT);pRun=false;document.getElementById('startBtn').textContent='Start';
        document.getElementById('termTimer').classList.add('done');beep();
        if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);showPomodoroDone();}
    },1000);}
}
function resetTimer(){pRun=false;if(pT)clearInterval(pT);pLeft=pTotal;document.getElementById('startBtn').textContent='Start';document.getElementById('termTimer').classList.remove('done');document.getElementById('termTimer').textContent=fmt(pLeft);}

// Keyboard nav
document.addEventListener('keydown',e=>{
  if(!document.getElementById('termScreen').classList.contains('active'))return;
  if(e.key==='ArrowRight'||e.key===' ')nextTerm();
  if(e.key==='ArrowLeft')prevTerm();
  if(e.key==='Escape')goBack();
});

// Streak tracking
function updateStreak(){
  const today=new Date().toDateString();
  const lastDay=localStorage.getItem('meowbot-last-day');
  let streak=parseInt(localStorage.getItem('meowbot-streak')||'0');
  if(lastDay===today){
    // Already studied today
  }else{
    const yesterday=new Date(Date.now()-86400000).toDateString();
    if(lastDay===yesterday){streak++;}
    else if(lastDay){streak=1;}
    else{streak=1;}
    localStorage.setItem('meowbot-streak',streak);
    localStorage.setItem('meowbot-last-day',today);
  }
  document.getElementById('csStreak').innerHTML=
    streak>0?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c-4.97 0-9-2.69-9-6 0-4 5-8 5-8s1 2 3 3c2-4 5-7 5-7s4 4 4 8c0 5.5-3.5 10-8 10z"/></svg><span class="streak-num">${streak}</span> day${streak>1?'s':''} streak`:'';
}
function markStudied(){
  const today=new Date().toDateString();
  const lastDay=localStorage.getItem('meowbot-last-day');
  if(lastDay!==today){
    const yesterday=new Date(Date.now()-86400000).toDateString();
    let streak=parseInt(localStorage.getItem('meowbot-streak')||'0');
    if(lastDay===yesterday){streak++;}else{streak=1;}
    localStorage.setItem('meowbot-streak',streak);
    localStorage.setItem('meowbot-last-day',today);
  }
}
// Marked terms
let marked=JSON.parse(localStorage.getItem('meowbot-marked')||'[]');
let markedMode=false; // when true, only cycle through marked terms
let markedList=[]; // filtered indices

function toggleMark(){
  const idx=markedMode?markedList[ti]:ti;
  const pos=marked.indexOf(idx);
  if(pos>=0){marked.splice(pos,1);}else{marked.push(idx);}
  localStorage.setItem('meowbot-marked',JSON.stringify(marked));
  updateMarkBtn();
}

function updateMarkBtn(){
  const idx=markedMode?markedList[ti]:ti;
  const isMarked=marked.includes(idx);
  const btn=document.getElementById('markBtn');
  btn.innerHTML=isMarked?'&#9733;':'&#9734;';
  btn.classList.toggle('marked',isMarked);
}

function openMarked(){
  markedList=[...marked];
  if(markedList.length===0){alert('No marked terms yet. Mark terms with the star button while learning.');return;}
  markedMode=true;
  ti=0;
  ensureAudio();
  document.getElementById('chapterDetail').classList.remove('active');
  document.getElementById('termScreen').classList.add('active');
  renderTerm();resetRot();startMascot();
}

function startMeditationMarked(){
  markedList=[...marked];
  if(markedList.length===0){alert('No marked terms yet.');return;}
  markedMode=true;
  startMeditation();
}

function updateMarkedCount(){
  const el=document.getElementById('markedCount');
  if(el)el.textContent=marked.length>0?`${marked.length} term${marked.length>1?'s':''} marked`:'No terms marked yet';
}

function updateDaysSinceStart(){
  let start=localStorage.getItem('meowbot-start');
  if(!start){start=new Date().toISOString();localStorage.setItem('meowbot-start',start);}
  const days=Math.floor((Date.now()-new Date(start).getTime())/86400000);
  document.getElementById('csDays').innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`+(days>0?`<span>${days}</span> day${days>1?'s':''} since start`:'Day 1');
}

updateStreak();
updateDaysSinceStart();
buildChapters();
// Loop all anims on chapters screen logo (green + white mixed)
(function loopCsLogo(){
  const v=document.getElementById('csLogoVideo');
  const allAnims=[...greenAnims,...whiteAnims];
  let gi=0;
  function next(){
    v.src=allAnims[gi%allAnims.length];gi++;
    const p=v.play();if(p)p.catch(()=>{});
  }
  v.onended=next;
  next();
})();

// ===== MEDITATION MODE =====
let medRunning=false,medIdx=0,medTimeout=null,medLang='en';
// Two persistent audio elements - created once on user tap, reused forever
let medMusicEl=null,medVoiceEl=null;

function medInit(){
  // MUST be called during user gesture (click/tap)
  if(!medMusicEl){
    medMusicEl=document.createElement('audio');
    medMusicEl.loop=true;
    medMusicEl.src='meditation-bg.mp3';
    document.body.appendChild(medMusicEl);
  }
  if(!medVoiceEl){
    medVoiceEl=document.createElement('audio');
    document.body.appendChild(medVoiceEl);
  }
  // Unlock both by playing during user gesture
  medMusicEl.play().then(()=>medMusicEl.pause()).catch(()=>{});
  medVoiceEl.src='audio/000.mp3';
  medVoiceEl.play().then(()=>medVoiceEl.pause()).catch(()=>{});
}

function chime(){
  ensureAudio();
  const notes=[523.25,659.25,783.99];
  notes.forEach((f,i)=>{
    setTimeout(()=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.value=0.15;
      g.gain.setValueAtTime(0.15,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+2);
      o.connect(g);g.connect(actx.destination);
      o.start();o.stop(actx.currentTime+2);
    },i*300);
  });
}

function medPlayVoice(idx,lang,cb){
  if(!medVoiceEl||!medRunning){if(cb)cb();return;}
  const folder=lang==='sk'?'audio-sk':'audio';

  let done=false;
  function finish(){if(done)return;done=true;if(cb)cb();}

  medVoiceEl.onended=finish;
  medVoiceEl.onerror=finish;
  medVoiceEl.src=`${folder}/${String(idx).padStart(3,'0')}.mp3`;
  medVoiceEl.play().catch(()=>{finish();});
  setTimeout(finish,12000);
}

function getMedTotal(){return markedMode?markedList.length:TERMS.length;}
function getMedRealIdx(i){return markedMode?markedList[i]:i;}

function showMedTerm(localIdx){
  if(!medRunning)return;
  const ri=getMedRealIdx(localIdx);
  const [t,d]=TERMS[ri];
  const termEl=document.getElementById('medTerm');
  const defEl=document.getElementById('medDef');
  document.getElementById('medCount').textContent=`${localIdx+1} / ${getMedTotal()}`;

  termEl.classList.remove('visible');
  defEl.classList.remove('visible');

  setTimeout(()=>{
    if(!medRunning)return;
    termEl.textContent=t;
    defEl.textContent=d;
    termEl.classList.add('visible');
    defEl.classList.add('visible');

    function afterVoices(){
      if(!medRunning)return;
      chime();
      medTimeout=setTimeout(()=>{
        if(!medRunning)return;
        medIdx=(medIdx+1)%getMedTotal();
        showMedTerm(medIdx);
      },4000);
    }

    if(medLang==='en'){
      medPlayVoice(ri,'en',()=>{
        if(!medRunning)return;
        medTimeout=setTimeout(()=>{medPlayVoice(ri,'en',afterVoices);},2000);
      });
    }else if(medLang==='sk'){
      medPlayVoice(ri,'sk',()=>{
        if(!medRunning)return;
        medTimeout=setTimeout(()=>{medPlayVoice(ri,'sk',afterVoices);},2000);
      });
    }else{
      medPlayVoice(ri,'en',()=>{
        if(!medRunning)return;
        medTimeout=setTimeout(()=>{medPlayVoice(ri,'sk',afterVoices);},2000);
      });
    }
  },600);
}

function startMeditation(lang){
  const total=markedMode?markedList.length:TERMS.length;
  const input=prompt(`Start from term number (1-${total}):`,'1');
  if(input===null)return;
  const startAt=Math.max(0,Math.min(total-1,parseInt(input)-1))||0;

  stopMeditation();
  ensureAudio();
  requestWakeLock();
  medInit();

  medLang=lang||'en';
  medRunning=true;
  medIdx=startAt;
  document.getElementById('medOverlay').classList.add('show');
  // Start music
  medMusicEl.currentTime=0;
  medMusicEl.play().catch(()=>{});
  // Start first term after 2s
  medTimeout=setTimeout(()=>{showMedTerm(medIdx);},2000);
}

function stopMeditation(){
  medRunning=false;
  if(medTimeout){clearTimeout(medTimeout);medTimeout=null;}
  releaseWakeLock();
  if(medVoiceEl){medVoiceEl.pause();medVoiceEl.onended=null;}
  if(medMusicEl){medMusicEl.pause();}
  document.getElementById('medOverlay').classList.remove('show');
  document.getElementById('medTerm').classList.remove('visible');
  document.getElementById('medDef').classList.remove('visible');
}

// Search
function openSearch(){
  document.getElementById('searchOverlay').classList.add('show');
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML='';
  setTimeout(()=>document.getElementById('searchInput').focus(),100);
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('show');
}
function doSearch(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const res=document.getElementById('searchResults');
  if(!q){res.innerHTML='';return;}
  const matches=[];
  TERMS.forEach((t,i)=>{
    if(t[0].toLowerCase().includes(q)||t[1].toLowerCase().includes(q)){
      matches.push(i);
    }
  });
  if(matches.length===0){
    res.innerHTML='<div class="search-empty">No results</div>';
    return;
  }
  res.innerHTML=matches.slice(0,20).map(i=>{
    const [term,def,sub]=TERMS[i];
    return `<button class="search-item" onclick="goToTerm(${i})"><div class="si-term">${term}</div><div class="si-def">${def.substring(0,80)}${def.length>80?'...':''}</div><div class="si-sub">${sub}</div></button>`;
  }).join('');
}
function goToTerm(i){
  closeSearch();
  markedMode=false;
  ti=i;
  ensureAudio();
  document.getElementById('chaptersScreen').classList.remove('active');
  document.getElementById('chapterDetail').classList.remove('active');
  document.getElementById('termScreen').classList.add('active');
  renderTerm();resetRot();startMascot();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('searchOverlay').classList.contains('show')){closeSearch();}
});
</script>
