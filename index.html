<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meowbot</title>
<link rel="icon" href="meowbot.png" type="image/png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;color:#111;background:#3ced87;-webkit-font-smoothing:antialiased}

  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.active{display:flex}

  /* ===== CHAPTERS SCREEN ===== */
  #chaptersScreen{background:#3ced87;color:#111;align-items:center;justify-content:center;gap:24px;padding:32px}

  .cs-logo{display:flex;align-items:center;justify-content:center}

  .cs-chapters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:720px}
  .cs-ch-btn{
    background:none;border:none;cursor:pointer;
    color:rgba(0,0,0,.5);font-family:inherit;font-size:15px;font-weight:500;
    transition:color .2s;padding:8px 0;letter-spacing:-.2px;
  }
  .cs-ch-btn:hover{color:rgba(0,0,0,.8)}


  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ===== TERM SCREEN ===== */
  #termScreen{background:#ffffff;padding:32px 48px;flex-direction:column;align-items:center;justify-content:center;gap:16px}

  .term-back{
    position:fixed;top:24px;left:24px;
    background:none;border:1.5px solid #e0e0e0;border-radius:100px;
    padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#999;transition:all .2s;z-index:10;
    display:flex;align-items:center;gap:6px;
  }
  .term-back:hover{border-color:#3ced87;color:#3ced87}

  .term-topright{
    position:fixed;top:24px;right:24px;
    display:flex;align-items:center;gap:10px;z-index:10;
  }
  .term-timer{font-size:15px;font-weight:600;color:#bbb;font-variant-numeric:tabular-nums;letter-spacing:-.3px;cursor:pointer}
  .term-timer.done{color:#3ced87;animation:pulse 1s infinite}
  .tr-btn{
    background:#f5f5f5;border:none;border-radius:100px;
    padding:5px 14px;font-size:11px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#999;transition:all .15s;
  }
  .tr-btn:hover{background:#eee;color:#111}
  .tr-sep{width:1px;height:20px;background:#e8e8e8}
  .rot-pills{display:flex;gap:3px}
  .rot-pill{
    background:none;border:1px solid #ddd;border-radius:100px;
    padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#bbb;transition:all .15s;
  }
  .rot-pill:hover{color:#111;border-color:#999}
  .rot-pill.on{background:#111;color:#fff;border-color:#111}
  .rot-countdown{font-size:11px;font-weight:600;color:#bbb;font-variant-numeric:tabular-nums;min-width:28px}
  .notif-toggle{
    background:none;border:none;cursor:pointer;color:#bbb;
    transition:color .2s;display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;
  }
  .notif-toggle:hover{color:#111}
  .notif-toggle.active{color:#3ced87}
  .term-nav{
    display:flex;gap:6px;
  }
  .term-nav button{
    background:#f5f5f5;border:none;border-radius:100px;
    width:36px;height:36px;cursor:pointer;font-family:inherit;
    color:#999;transition:all .15s;display:flex;align-items:center;justify-content:center;
  }
  .term-nav button:hover{background:#eee;color:#111}

  .term-left{display:flex;align-items:center;justify-content:center}
  .term-left img{max-width:200px;max-height:28vh;object-fit:contain;border-radius:16px}

  .term-right{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:600px}
  .term-chapter{
    position:fixed;bottom:32px;left:32px;z-index:10;
    font-size:12px;font-weight:500;color:#ccc;text-transform:uppercase;letter-spacing:1.2px;
  }
  .term-word{font-size:56px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px;color:#111}
  .term-def{font-size:26px;font-weight:400;line-height:1.65;color:#555}
  .term-meta{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .term-count{font-size:13px;color:#ccc;font-weight:500;font-variant-numeric:tabular-nums}
  .progress-track{width:160px;height:3px;background:#e8e8e8;border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:#3ced87;border-radius:2px;transition:width .3s}

  .mascot-corner{
    position:fixed;bottom:48px;right:80px;z-index:10;
    width:140px;height:140px;
  }
  .mascot-corner img{width:100%;height:100%;object-fit:contain;display:block}
  .mascot-corner video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
  .mascot-corner video.playing{opacity:1}

  /* Overlays */
  .anim-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
  .anim-overlay.show{opacity:1;pointer-events:auto}
  .anim-overlay video{max-width:360px;max-height:360px;border-radius:24px}
  .anim-overlay.white{background:rgba(255,255,255,.97)}
  .anim-overlay.green{background:rgba(0,200,83,.97)}

  .green-overlay{position:fixed;inset:0;background:#00c853;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
  .green-overlay.show{opacity:1;pointer-events:auto}
  .green-overlay .green-title{color:#fff;font-size:32px;font-weight:800;margin-bottom:8px}
  .green-overlay .green-sub{color:rgba(255,255,255,.7);font-size:16px;font-weight:500;margin-bottom:32px}
  .green-overlay .green-dismiss{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:100px;padding:12px 32px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
  .green-overlay .green-dismiss:hover{background:rgba(255,255,255,.35)}

  /* Meditation mode */
  .med-btn{
    background:none;border:none;cursor:pointer;
    color:rgba(0,0,0,.35);font-family:inherit;font-size:14px;font-weight:500;
    transition:color .2s;padding:4px 0;letter-spacing:-.2px;
  }
  .med-btn:hover{color:rgba(0,0,0,.6)}

  .med-overlay{
    position:fixed;inset:0;background:#111;z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .8s;
  }
  .med-overlay.show{opacity:1;pointer-events:auto}
  .med-term{font-size:48px;font-weight:700;color:#fff;margin-bottom:12px;text-align:center;
    opacity:0;transition:opacity .8s;max-width:80vw}
  .med-term.visible{opacity:1}
  .med-def{font-size:22px;font-weight:400;color:rgba(255,255,255,.5);line-height:1.6;
    text-align:center;max-width:700px;opacity:0;transition:opacity .8s .3s}
  .med-def.visible{opacity:1}
  .med-count{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
    font-size:13px;color:rgba(255,255,255,.2);font-variant-numeric:tabular-nums}
  .med-close{
    position:fixed;top:24px;right:24px;z-index:210;
    background:rgba(255,255,255,.1);border:none;border-radius:100px;
    padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;color:rgba(255,255,255,.5);transition:all .2s;
  }
  .med-close:hover{background:rgba(255,255,255,.2);color:#fff}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeUp .25s ease}

  @media (max-width:900px){
    .term-left img{max-width:140px;max-height:22vh}
    .term-word{font-size:36px}
    .term-def{font-size:20px}
  }
</style>
</head>

<!-- CHAPTERS SCREEN (green) -->
<div class="screen active" id="chaptersScreen">
  <div class="cs-logo"><video id="csLogoVideo" muted playsinline autoplay loop style="width:120px;height:120px;object-fit:contain"></video></div>

  <div class="cs-chapters" id="csChapters"></div>
  <button class="med-btn" onclick="startMeditation()">Meditation</button>
</div>

<!-- Meditation overlay -->
<div class="med-overlay" id="medOverlay">
  <button class="med-close" onclick="stopMeditation()">Stop</button>
  <div class="med-term" id="medTerm"></div>
  <div class="med-def" id="medDef"></div>
  <div class="med-count" id="medCount"></div>
</div>

<!-- TERM SCREEN (white) -->
<div class="screen" id="termScreen">
  <button class="term-back" onclick="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Chapters
  </button>

  <div class="term-topright">
    <div class="term-nav">
      <button onclick="prevTerm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button onclick="nextTerm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="tr-sep"></div>
    <div class="rot-pills">
      <button class="rot-pill" data-i="60" onclick="setRot(60)">1m</button>
      <button class="rot-pill" data-i="120" onclick="setRot(120)">2m</button>
      <button class="rot-pill on" data-i="300" onclick="setRot(300)">5m</button>
      <button class="rot-pill" data-i="600" onclick="setRot(600)">10m</button>
    </div>
    <span class="rot-countdown" id="rotCountdown">5:00</span>
    <div class="tr-sep"></div>
    <button class="notif-toggle active" id="notifToggle" onclick="cycleNotif()" title="Sound on">
      <svg id="notifIconOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      <svg id="notifIconOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <div class="tr-sep"></div>
    <div class="term-timer" id="termTimer" onclick="cycleTimerPreset()" title="Click to change">25:00</div>
    <button class="tr-btn" id="startBtn" onclick="toggleTimer()">Start</button>
    <button class="tr-btn" onclick="resetTimer()">Reset</button>
  </div>

  <div class="term-left">
    <img id="termImg" src="" alt="">
  </div>
  <div class="term-right" id="termRight">
    <div class="term-chapter" id="termCh"></div>
    <div class="term-word" id="termWord"></div>
    <div class="term-def" id="termDef"></div>
    <div class="term-meta">
      <span class="term-count" id="termCount"></span>
      <div class="progress-track"><div class="progress-fill" id="termProg"></div></div>
    </div>
  </div>

  <div class="mascot-corner">
    <img src="mascot-still.png" alt="">
    <video id="mascotVideo" muted playsinline></video>
  </div>
</div>

<!-- Overlays -->
<div class="anim-overlay white" id="animWhite"><video id="animWhiteVideo" muted playsinline></video></div>
<div class="anim-overlay green" id="animGreen"><video id="animGreenVideo" muted playsinline></video></div>
<div class="green-overlay" id="pomodoroOverlay">
  <video id="pomodoroVideo" muted playsinline style="max-width:280px;max-height:280px;border-radius:24px;margin-bottom:24px"></video>
  <div class="green-title">Time's up!</div>
  <div class="green-sub">Great study session</div>
  <button class="green-dismiss" onclick="dismissPomodoro()">Continue</button>
</div>

let ti=0,rot=300,rotT=null,notif='sound';
let pTotal=25*60,pLeft=25*60,pRun=false,pT=null,actx=null;

function getImgIndex(){return ti;}

function ensureAudio(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}if(actx.state==='suspended')actx.resume();}
// Unlock audio on first user tap
document.addEventListener('click',function unlock(){ensureAudio();document.removeEventListener('click',unlock);},{once:true});

function beep(){
  ensureAudio();
  // First tone
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.frequency.value=800;o.type='sine';g.gain.value=0.5;
  g.gain.setValueAtTime(0.5,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+0.3);
  o.start(actx.currentTime);o.stop(actx.currentTime+0.3);
  // Second tone
  setTimeout(()=>{
    const o2=actx.createOscillator(),g2=actx.createGain();
    o2.connect(g2);g2.connect(actx.destination);
    o2.frequency.value=1200;o2.type='sine';g2.gain.value=0.5;
    g2.gain.setValueAtTime(0.5,actx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+0.3);
    o2.start(actx.currentTime);o2.stop(actx.currentTime+0.3);
  },200);
}
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB';u.rate=0.85;u.pitch=1;u.volume=1;
  speechSynthesis.speak(u);
}
// Unlock speech on first tap (iOS/Safari requirement)
document.addEventListener('click',function unlockSpeech(){
  const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);
  document.removeEventListener('click',unlockSpeech);
},{once:true});

function doAlert(){
  if(notif==='sound'){
    ensureAudio();beep();
    const [t,d]=TERMS[ti];
    setTimeout(()=>{speak(t+'. '+d);},600);
  }
  if(notif==='vibration'&&navigator.vibrate)navigator.vibrate([80,40,80]);
}

function playWhiteAnim(cb){
  const ov=document.getElementById('animWhite'),v=document.getElementById('animWhiteVideo');
  const count=Math.random()<.4?2:1;let played=0;
  function done(){ov.classList.remove('show');if(cb)cb();}
  function go(){
    v.src=nextWhiteAnim();ov.classList.add('show');
    const p=v.play();
    if(p)p.catch(()=>{done();});
    v.onended=()=>{played++;if(played<count)go();else done();};
    v.onerror=()=>{done();};
  }
  // Fallback: if video takes too long, skip
  const fallback=setTimeout(done,8000);
  const origDone=done;
  done=function(){clearTimeout(fallback);origDone();};
  go();
}
function playGreenAnim(cb){
  const ov=document.getElementById('animGreen'),v=document.getElementById('animGreenVideo');
  v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];ov.classList.add('show');v.play();
  v.onended=()=>{ov.classList.remove('show');if(cb)cb();};
}

function showPomodoroDone(){
  const ov=document.getElementById('pomodoroOverlay'),v=document.getElementById('pomodoroVideo');
  v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];ov.classList.add('show');v.play();
  v.onended=()=>{v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];v.play();};
}
function dismissPomodoro(){document.getElementById('pomodoroOverlay').classList.remove('show');document.getElementById('pomodoroVideo').pause();}

// Build chapter buttons (only chapters that have data)
function buildChapters(){
  // For now only Chapter 1 has content
  document.getElementById('csChapters').innerHTML=
    `<button class="cs-ch-btn" onclick="openChapter()">Start learning</button>`;
}

// Mascot: sits still, occasionally plays animation
let mascotIdx=0,mascotTimer=null;
function startMascot(){
  scheduleMascotAnim();
}
function scheduleMascotAnim(){
  const delay=8000+Math.random()*15000; // 8-23 seconds
  mascotTimer=setTimeout(()=>{
    const v=document.getElementById('mascotVideo');
    v.src=whiteAnims[mascotIdx%whiteAnims.length];
    mascotIdx++;
    v.classList.add('playing');
    v.play();
    v.onended=()=>{v.classList.remove('playing');scheduleMascotAnim();};
  },delay);
}
function stopMascot(){
  if(mascotTimer)clearTimeout(mascotTimer);
  const v=document.getElementById('mascotVideo');
  v.pause();v.classList.remove('playing');v.onended=null;
}

function openChapter(){
  const saved=localStorage.getItem('meowbot-ti');
  ti=saved?parseInt(saved):0;
  if(ti>=TERMS.length)ti=0;
  document.getElementById('chaptersScreen').classList.remove('active');
  document.getElementById('termScreen').classList.add('active');
  renderTerm();
  resetRot();
  startMascot();
}

function goBack(){
  if(rotT)clearInterval(rotT);
  stopMascot();
  document.getElementById('termScreen').classList.remove('active');
  document.getElementById('chaptersScreen').classList.add('active');
}

function renderTerm(){
  const [t,d,sub,imgIdx]=TERMS[ti];
  localStorage.setItem('meowbot-ti',ti);
  const r=document.getElementById('termRight');
  r.classList.remove('fade');void r.offsetWidth;r.classList.add('fade');
  document.getElementById('termCh').textContent=sub;
  document.getElementById('termImg').src='img/'+IMGS[imgIdx];
  document.getElementById('termWord').textContent=t;
  document.getElementById('termDef').textContent=d;
  document.getElementById('termCount').textContent=`${ti+1} / ${TERMS.length}`;
  document.getElementById('termProg').style.width=`${((ti+1)/TERMS.length)*100}%`;
}

function nextTerm(){ti=(ti+1)%TERMS.length;renderTerm();doAlert();resetRot();}
function prevTerm(){ti=(ti-1+TERMS.length)%TERMS.length;renderTerm();doAlert();resetRot();}
function autoNext(){
  ti=(ti+1)%TERMS.length;
  doAlert();
  playWhiteAnim(()=>{renderTerm();});
}
let rotLeft=300,rotTick=null;
function fmtRot(s){const m=Math.floor(s/60),sec=s%60;return sec>0?`${m}:${String(sec).padStart(2,'0')}`:`${m}:00`;}
function resetRot(){
  if(rotT)clearInterval(rotT);if(rotTick)clearInterval(rotTick);
  rotLeft=rot;
  document.getElementById('rotCountdown').textContent=fmtRot(rotLeft);
  rotTick=setInterval(()=>{rotLeft--;document.getElementById('rotCountdown').textContent=fmtRot(Math.max(0,rotLeft));},1000);
  rotT=setInterval(()=>{rotLeft=rot;autoNext();},rot*1000);
}

function setNotif(m){notif=m;updateNotifIcon();if(m==='sound')beep();if(m==='vibration'&&navigator.vibrate)navigator.vibrate(80);}
function cycleNotif(){const modes=['none','sound','vibration'];notif=modes[(modes.indexOf(notif)+1)%3];setNotif(notif);}
function updateNotifIcon(){const on=notif!=='none';document.getElementById('notifIconOff').style.display=on?'none':'block';document.getElementById('notifIconOn').style.display=on?'block':'none';document.getElementById('notifToggle').classList.toggle('active',on);document.getElementById('notifToggle').title=notif==='none'?'Alerts off':notif==='sound'?'Sound on':'Vibrate on';}
function setRot(s){rot=s;document.querySelectorAll('.rot-pill').forEach(b=>b.classList.toggle('on',+b.dataset.i===s));if(rotT)resetRot();}

function fmt(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
const timerPresets=[10,15,25,30,45,60];let tpIdx=2;
function cycleTimerPreset(){if(pRun)return;tpIdx=(tpIdx+1)%timerPresets.length;setTimer(timerPresets[tpIdx]);}
function setTimer(m){pTotal=m*60;pLeft=m*60;pRun=false;if(pT)clearInterval(pT);document.getElementById('startBtn').textContent='Start';document.getElementById('termTimer').classList.remove('done');document.getElementById('termTimer').textContent=fmt(pLeft);}
function toggleTimer(){
  if(pRun){pRun=false;clearInterval(pT);document.getElementById('startBtn').textContent='Start';}
  else{pRun=true;document.getElementById('startBtn').textContent='Pause';
    pT=setInterval(()=>{pLeft--;document.getElementById('termTimer').textContent=fmt(pLeft);
      if(pLeft<=0){clearInterval(pT);pRun=false;document.getElementById('startBtn').textContent='Start';
        document.getElementById('termTimer').classList.add('done');beep();
        if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);showPomodoroDone();}
    },1000);}
}
function resetTimer(){pRun=false;if(pT)clearInterval(pT);pLeft=pTotal;document.getElementById('startBtn').textContent='Start';document.getElementById('termTimer').classList.remove('done');document.getElementById('termTimer').textContent=fmt(pLeft);}

// Keyboard nav
document.addEventListener('keydown',e=>{
  if(!document.getElementById('termScreen').classList.contains('active'))return;
  if(e.key==='ArrowRight'||e.key===' ')nextTerm();
  if(e.key==='ArrowLeft')prevTerm();
  if(e.key==='Escape')goBack();
});

buildChapters();
// Loop all anims on chapters screen logo (green + white mixed)
(function loopCsLogo(){
  const v=document.getElementById('csLogoVideo');
  const allAnims=[...greenAnims,...whiteAnims];
  let gi=0;
  function next(){
    v.src=allAnims[gi%allAnims.length];gi++;
    const p=v.play();if(p)p.catch(()=>{});
  }
  v.onended=next;
  next();
})();

// ===== MEDITATION MODE =====
let medRunning=false,medIdx=0,medDrone=null,medDroneGain=null,medTimeout=null;

function createDrone(){
  ensureAudio();
  medDroneGain=actx.createGain();
  medDroneGain.gain.value=0;
  medDroneGain.connect(actx.destination);

  // Layered soft pad: three detuned oscillators
  const freqs=[130.81,196,261.63]; // C3, G3, C4
  freqs.forEach(f=>{
    const o=actx.createOscillator();
    const g=actx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.value=0.06;
    o.connect(g);g.connect(medDroneGain);
    o.start();

    // Subtle LFO for movement
    const lfo=actx.createOscillator();
    const lfoG=actx.createGain();
    lfo.frequency.value=0.15+Math.random()*0.1;
    lfoG.gain.value=3;
    lfo.connect(lfoG);lfoG.connect(o.frequency);
    lfo.start();
  });

  // Fade in
  medDroneGain.gain.setValueAtTime(0,actx.currentTime);
  medDroneGain.gain.linearRampToValueAtTime(1,actx.currentTime+3);
}

function chime(){
  ensureAudio();
  const notes=[523.25,659.25,783.99]; // C5, E5, G5
  notes.forEach((f,i)=>{
    setTimeout(()=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.value=0.15;
      g.gain.setValueAtTime(0.15,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+2);
      o.connect(g);g.connect(actx.destination);
      o.start();o.stop(actx.currentTime+2);
    },i*300);
  });
}

function medSpeak(text,cb){
  if(!('speechSynthesis' in window)){if(cb)setTimeout(cb,2000);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB';u.rate=0.75;u.pitch=0.9;u.volume=1;
  u.onend=()=>{if(cb)cb();};
  u.onerror=()=>{if(cb)cb();};
  speechSynthesis.speak(u);
}

function showMedTerm(idx){
  if(!medRunning)return;
  const [t,d]=TERMS[idx];
  const termEl=document.getElementById('medTerm');
  const defEl=document.getElementById('medDef');
  document.getElementById('medCount').textContent=`${idx+1} / ${TERMS.length}`;

  // Fade out
  termEl.classList.remove('visible');
  defEl.classList.remove('visible');

  setTimeout(()=>{
    termEl.textContent=t;
    defEl.textContent=d;
    // Fade in
    termEl.classList.add('visible');
    defEl.classList.add('visible');

    // Speak term, then definition, then chime, then pause, then next
    medSpeak(t,()=>{
      if(!medRunning)return;
      setTimeout(()=>{
        medSpeak(d,()=>{
          if(!medRunning)return;
          // Chime + pause
          setTimeout(()=>{
            chime();
            medTimeout=setTimeout(()=>{
              if(!medRunning)return;
              medIdx=(medIdx+1)%TERMS.length;
              showMedTerm(medIdx);
            },4000); // 4s pause between terms
          },800);
        });
      },500);
    });
  },600);
}

function startMeditation(){
  ensureAudio();
  medRunning=true;
  medIdx=0;
  document.getElementById('medOverlay').classList.add('show');
  createDrone();
  // Start after 2s to let drone fade in
  medTimeout=setTimeout(()=>{showMedTerm(medIdx);},2000);
}

function stopMeditation(){
  medRunning=false;
  if(medTimeout)clearTimeout(medTimeout);
  speechSynthesis.cancel();
  // Fade out drone
  if(medDroneGain){
    medDroneGain.gain.linearRampToValueAtTime(0,actx.currentTime+1.5);
    setTimeout(()=>{medDroneGain.disconnect();medDroneGain=null;},2000);
  }
  document.getElementById('medOverlay').classList.remove('show');
  document.getElementById('medTerm').classList.remove('visible');
  document.getElementById('medDef').classList.remove('visible');
}
</script>
