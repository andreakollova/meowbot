<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meowbot</title>
<link rel="icon" href="meowbot.png" type="image/png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;color:#111;background:#3ced85;-webkit-font-smoothing:antialiased}

  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.active{display:flex}

  /* ===== CHAPTERS SCREEN ===== */
  #chaptersScreen{background:#3ced85;color:#111;align-items:center;justify-content:center;gap:24px;padding:32px}

  .cs-logo{display:flex;align-items:center;justify-content:center}

  .cs-chapters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:720px}
  .cs-ch-btn{
    background:rgba(255,255,255,.25);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1.5px solid rgba(255,255,255,.4);
    border-radius:16px;
    padding:16px 28px;
    cursor:pointer;
    transition:all .2s;
    text-align:center;
    display:flex;align-items:center;gap:10px;
    color:#111;font-family:inherit;font-size:15px;font-weight:600;
  }
  .cs-ch-btn:hover{background:rgba(255,255,255,.5);transform:scale(1.03)}
  .cs-ch-btn .num{font-size:24px;font-weight:800;opacity:.5}


  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ===== TERM SCREEN ===== */
  #termScreen{background:#3ced85;padding:32px 48px;flex-direction:row;align-items:center;gap:48px}

  .term-back{
    position:fixed;top:24px;left:24px;
    background:rgba(0,0,0,.08);border:none;border-radius:100px;
    padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;color:rgba(0,0,0,.5);transition:all .2s;z-index:10;
    display:flex;align-items:center;gap:6px;
  }
  .term-back:hover{background:rgba(0,0,0,.15);color:#111}

  .term-topright{
    position:fixed;top:24px;right:24px;
    display:flex;align-items:center;gap:10px;z-index:10;
  }
  .term-timer{font-size:15px;font-weight:600;color:rgba(0,0,0,.4);font-variant-numeric:tabular-nums;letter-spacing:-.3px;cursor:pointer}
  .term-timer.done{color:#111;animation:pulse 1s infinite}
  .tr-btn{
    background:rgba(0,0,0,.08);border:none;border-radius:100px;
    padding:5px 14px;font-size:11px;font-weight:600;cursor:pointer;
    font-family:inherit;color:rgba(0,0,0,.5);transition:all .15s;
  }
  .tr-btn:hover{background:rgba(0,0,0,.15);color:#111}
  .tr-sep{width:1px;height:20px;background:rgba(0,0,0,.1)}
  .rot-pills{display:flex;gap:3px}
  .rot-pill{
    background:none;border:1px solid rgba(0,0,0,.15);border-radius:100px;
    padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;
    font-family:inherit;color:rgba(0,0,0,.35);transition:all .15s;
  }
  .rot-pill:hover{color:#111;border-color:rgba(0,0,0,.3)}
  .rot-pill.on{background:#111;color:#3ced85;border-color:#111}
  .notif-toggle{
    background:none;border:none;cursor:pointer;color:rgba(0,0,0,.35);
    transition:color .2s;display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;
  }
  .notif-toggle:hover{color:#111}
  .notif-toggle.active{color:#111}
  .term-nav{
    display:flex;gap:6px;
  }
  .term-nav button{
    background:rgba(0,0,0,.08);border:none;border-radius:100px;
    width:36px;height:36px;cursor:pointer;font-family:inherit;
    color:rgba(0,0,0,.4);transition:all .15s;display:flex;align-items:center;justify-content:center;
  }
  .term-nav button:hover{background:rgba(0,0,0,.15);color:#111}

  .term-left{flex:1;display:flex;align-items:center;justify-content:center}
  .term-left img{max-width:320px;max-height:55vh;object-fit:contain;border-radius:16px}

  .term-right{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:560px}
  .term-chapter{font-size:12px;font-weight:500;color:rgba(0,0,0,.35);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:16px}
  .term-word{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:16px;color:#111}
  .term-def{font-size:20px;font-weight:400;line-height:1.7;color:rgba(0,0,0,.6)}
  .term-meta{display:flex;align-items:center;gap:12px;margin-top:24px}
  .term-count{font-size:13px;color:rgba(0,0,0,.3);font-weight:500;font-variant-numeric:tabular-nums}
  .progress-track{flex:1;max-width:200px;height:3px;background:rgba(0,0,0,.1);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:#111;border-radius:2px;transition:width .3s}

  .mascot-corner{
    position:fixed;bottom:24px;right:24px;z-index:10;
    width:140px;height:140px;
  }
  .mascot-corner img{width:100%;height:100%;object-fit:contain;display:block}
  .mascot-corner video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
  .mascot-corner video.playing{opacity:1}

  /* Overlays */
  .anim-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
  .anim-overlay.show{opacity:1;pointer-events:auto}
  .anim-overlay video{max-width:360px;max-height:360px;border-radius:24px}
  .anim-overlay.white{background:rgba(60,237,133,.97)}
  .anim-overlay.green{background:rgba(0,200,83,.97)}

  .green-overlay{position:fixed;inset:0;background:#00c853;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
  .green-overlay.show{opacity:1;pointer-events:auto}
  .green-overlay .green-title{color:#fff;font-size:32px;font-weight:800;margin-bottom:8px}
  .green-overlay .green-sub{color:rgba(255,255,255,.7);font-size:16px;font-weight:500;margin-bottom:32px}
  .green-overlay .green-dismiss{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:100px;padding:12px 32px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
  .green-overlay .green-dismiss:hover{background:rgba(255,255,255,.35)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeUp .25s ease}

  /* Portrait / smaller screens */
  @media (max-width:900px),(max-height:500px) and (max-width:900px){
    #termScreen{flex-direction:column;padding:24px;gap:20px;justify-content:center}
    .term-left img{max-width:180px;max-height:30vh}
    .term-word{font-size:28px}
    .term-def{font-size:16px}
    .cs-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  }

  @media (orientation:portrait){
    #termScreen{flex-direction:column;padding:24px 32px;gap:20px;justify-content:center}
    .term-left img{max-width:200px;max-height:28vh}
    .term-right{align-items:center;text-align:center}
    .term-word{font-size:32px}
    .term-def{font-size:17px}
    .term-meta{justify-content:center}
  }
</style>
</head>
<body>

<!-- CHAPTERS SCREEN (green) -->
<div class="screen active" id="chaptersScreen">
  <div class="cs-logo"><img src="meowbot.png" alt="" style="width:100px;height:100px;object-fit:contain"></div>

  <div class="cs-chapters" id="csChapters"></div>


</div>

<!-- TERM SCREEN (white) -->
<div class="screen" id="termScreen">
  <button class="term-back" onclick="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Chapters
  </button>

  <div class="term-topright">
    <div class="term-nav">
      <button onclick="prevTerm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button onclick="nextTerm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="tr-sep"></div>
    <div class="rot-pills">
      <button class="rot-pill" data-i="60" onclick="setRot(60)">1m</button>
      <button class="rot-pill" data-i="120" onclick="setRot(120)">2m</button>
      <button class="rot-pill on" data-i="300" onclick="setRot(300)">5m</button>
      <button class="rot-pill" data-i="600" onclick="setRot(600)">10m</button>
    </div>
    <div class="tr-sep"></div>
    <button class="notif-toggle" id="notifToggle" onclick="cycleNotif()" title="Alerts off">
      <svg id="notifIconOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      <svg id="notifIconOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <div class="tr-sep"></div>
    <div class="term-timer" id="termTimer" onclick="cycleTimerPreset()" title="Click to change">25:00</div>
    <button class="tr-btn" id="startBtn" onclick="toggleTimer()">Start</button>
    <button class="tr-btn" onclick="resetTimer()">Reset</button>
  </div>

  <div class="term-left">
    <img id="termImg" src="" alt="">
  </div>
  <div class="term-right" id="termRight">
    <div class="term-chapter" id="termCh"></div>
    <div class="term-word" id="termWord"></div>
    <div class="term-def" id="termDef"></div>
    <div class="term-meta">
      <span class="term-count" id="termCount"></span>
      <div class="progress-track"><div class="progress-fill" id="termProg"></div></div>
    </div>
  </div>

  <div class="mascot-corner">
    <img src="meowbot.png" alt="">
    <video id="mascotVideo" muted playsinline></video>
  </div>
</div>

<!-- Overlays -->
<div class="anim-overlay white" id="animWhite"><video id="animWhiteVideo" muted playsinline></video></div>
<div class="anim-overlay green" id="animGreen"><video id="animGreenVideo" muted playsinline></video></div>
<div class="green-overlay" id="pomodoroOverlay">
  <video id="pomodoroVideo" muted playsinline style="max-width:280px;max-height:280px;border-radius:24px;margin-bottom:24px"></video>
  <div class="green-title">Time's up!</div>
  <div class="green-sub">Great study session</div>
  <button class="green-dismiss" onclick="dismissPomodoro()">Continue</button>
</div>

"Chapter 1: Basics & Definitions":[["Robotics","The interdisciplinary field concerned with designing, building, programming, operating, and applying robots."],["Robot","A programmable physical machine that performs tasks through controlled movements and actions."],["Robota","The Slavic word meaning subordinate or forced labour from which the word \"robot\" originated."],["Automation","The use of technology to perform tasks with reduced human involvement."],["Flexible automation","Automation that can be adapted to different tasks or production requirements."],["Industrial robot","An automatically controlled, programmable, multipurpose manipulator with at least three programmable axes, used for industrial tasks."],["Mobile robot","A robot that moves through its environment and adapts its actions using information from sensors."],["Autonomous mobile robot (AMR)","A mobile robot that navigates and performs tasks without continuous human control."],["Manipulator","A mechanical structure, usually a robotic arm, used to move or handle objects."],["End effector","A tool or device attached to the end of a robot arm to perform a task."],["Gripper","An end effector used to grasp, hold, and release objects."],["Control unit","The hardware and software that process instructions and control a robot's actions."],["Sensor","A device that measures properties of a robot or its environment."],["Actuator","A component that converts energy into physical movement."],["Actuation","The process of producing movement through an actuator."],["Workpiece","An object being handled, processed, or manufactured by a robot."]],
"Chapter 2: Classification":[["Robot classification","The grouping of robots according to characteristics such as intelligence, application, control, or geometry."],["Japanese Industrial Robot Association (JIRA)","The association associated with the six-category robot classification presented in the lesson."],["Manual handling device - Class 1","A device with multiple axes that is directly operated by a person."],["Fixed-sequence robot - Class 2","A robot that repeats a predefined sequence of actions that is difficult to change."],["Variable-sequence robot - Class 3","A robot whose predefined sequence of actions can be changed to support flexible automation."],["Playback robot - Class 4","A robot that records movements demonstrated by an operator and repeats them automatically."],["Numerically controlled robot - Class 5","A robot whose movements are specified through numerical instructions in program code."],["Intelligent robot - Class 6","A robot that uses information about its environment to perform tasks under changing conditions."]],
"Chapter 3: Joints & Kinematics":[["Link","A rigid part of a robot that can move relative to other parts."],["Joint","A connection between links that allows relative movement."],["Axis","A reference line along which translation occurs or around which rotation occurs."],["Degree of freedom (DOF)","An independent movement available to a mechanical system, such as translation or rotation."],["Six degrees of freedom","Three independent translational movements and three independent rotational movements in three-dimensional space."],["Rotation","Movement around an axis."],["Translation","Linear movement without a change in orientation."],["Revolute joint (R)","A joint that allows rotation around an axis."],["Prismatic joint (P)","A joint that allows linear movement along an axis."],["Parallel axes","Axes that run in the same direction and remain a constant distance apart."],["Orthogonal axes","Axes whose directions form a right angle."],["Perpendicular arrangement","The lesson's notation for an axis relationship described using a right angle relative to the axes' common normal."],["Geometric robot classification","The classification of robots according to the arrangement of their joints, links, and axes."],["R||R||P configuration","A joint arrangement with two revolute joints and one prismatic joint whose axes are parallel."],["Kinematics","The study of motion without considering the forces that cause it."],["Robot configuration","The arrangement of a robot's joints and links, or their positions at a particular moment."],["Position","The location of an object relative to a reference system."],["Orientation","The rotational alignment of an object relative to a reference system."],["Trajectory","A description of how a robot's position or joint values change over time."]],
"Chapter 4: Coordinate Systems":[["Coordinate system","A reference framework used to describe positions and movements."],["Origin","The reference point at which all coordinates are zero."],["Coordinate axes","Reference directions used to specify coordinates."],["Vector","A mathematical quantity with magnitude and direction, used to represent position or displacement."],["Coordinate transformation","A mathematical conversion of coordinates from one reference system to another."],["Cartesian coordinates","Coordinates that describe a position using distances along the x, y, and z axes."],["Joint coordinates","Values describing the position of each robot joint, such as its angle or linear displacement."],["World coordinate system","A fixed reference system associated with the robot's overall environment."],["Base coordinate system","A reference system attached to the robot's base."],["Joint coordinate system","A reference system associated with a joint and described relative to another joint or frame."],["Tool coordinate system","A reference system attached to the robot's tool."],["Object coordinate system","A reference system attached to the object being handled."],["Mechanical interface coordinate system","A reference system attached to the flange where the end effector is mounted."],["Flange","The mechanical mounting surface used to attach an end effector to a robot."],["Workpiece coordinate system","A reference system associated with a workpiece or its placement."],["Cartesian coordinate system","A coordinate system using mutually perpendicular axes, usually x, y, and z."],["Polar coordinate system","A two-dimensional coordinate system describing a point by its distance r from the origin and its angle \u03c6."],["Cylindrical coordinate system","A three-dimensional coordinate system describing a point using radius r, angle \u03c6, and height z."],["Radius (r)","The distance from an origin or axis of rotation."],["Rotation angle (\u03c6)","The angular displacement measured from a reference direction."]],
"Chapter 5: Interdisciplinary Foundations":[["Mechanical engineering","The discipline concerned with mechanical structures, motion, and physical systems."],["Electrical engineering","The discipline concerned with electrical power, circuits, electronics, and related systems."],["Computer science","The study of computation, algorithms, software, and information processing."],["Manufacturing technology","The methods and equipment used to produce goods."],["Systems engineering","An interdisciplinary approach to designing and integrating components into a functioning system."],["Measurement technology","The methods and devices used to measure physical quantities."],["Sensor technology","The development and application of devices that collect information about physical conditions."],["Robot control","The process of directing a robot's movements and actions."],["Regulation","The use of feedback to keep a measured quantity close to a desired value."],["Hardware","The physical components of a robotic system."],["Software","The programs and instructions that determine how a robotic system operates."],["Ethics in robotics","The consideration of moral questions about the design, use, and effects of robots."],["Regulatory framework","The rules and requirements governing the development and use of robots."],["Workplace safety","Measures that protect people from hazards in working environments."],["Social acceptance","People's willingness to use, trust, or support robots."]],
"Chapter 6: History":[["Artifact","An object created by humans."],["Water clock","A device that measures time through the controlled flow of water."],["Stanford Arm","A robot arm developed in 1969 with six degrees of freedom and a design that simplified movement calculations."],["MIT Arm","A robot arm developed by Victor Scheinman in 1972 that contributed to the development of programmable industrial manipulators."],["PUMA","Programmable Universal Manipulation Arm; a programmable industrial robot arm associated with the development of Scheinman's designs."],["SCARA","Selective Compliance Assembly Robot Arm; a robot arm designed for efficient assembly, with compliance in selected directions."],["Parallel robot","A robot whose moving platform or end effector is connected to its base through multiple mechanical chains."],["Electro-light-sensitive Internal-External","An early mobile robotic device that responded to light and interacted with its surroundings."],["Shakey","An early mobile robot that combined sensing, environmental reasoning, and action planning."],["Hierarchical control","A control structure organised into levels, from basic movements to complex planning."],["Low-level routine","A basic control operation used as a building block for more complex actions."],["Cognitive robot","A robot that uses internal representations and reasoning to plan and perform actions."],["World model","An internal representation of the environment used for reasoning and planning."],["Localization","The process of estimating a robot's position within an environment."],["Navigation","The process of determining and following a route to a destination."],["Triangulation sensor","A sensor that estimates distance using geometric relationships between observation points and a target."],["Stereo vision","The use of images from two viewpoints to estimate depth and three-dimensional structure."],["Stanford Cart","An early mobile robot that used camera-based perception to navigate around obstacles."],["WAVE","A programming language described in the lesson as having been developed specifically for robotics."],["Micromouse robot","A small mobile robot designed to navigate a maze."],["KAMRO","Karlsruhe Autonomous Mobile Robot; a mobile robotic system developed to perform autonomous assembly tasks."],["Mars rover","A mobile robot designed to explore and investigate the surface of Mars."]],
"Chapter 7: Trends & Challenges":[["Production cell","A group of machines and equipment organised to carry out a set of manufacturing tasks."],["Human-machine interaction","The exchange of commands and information between people and machines."],["Human-friendly task specification","A way of describing robot tasks that is easy for human operators to understand and use."],["Mobile manipulation","The combination of mobility and object handling in one robotic system."],["Low-cost actuation","The use of affordable components to generate robotic movement."],["Subsystem","A component system that performs a specific function within a larger system."],["Composition of subsystems","The integration of separate modules into a complete robotic system."],["Standardized interface","A shared connection or communication specification that allows different components to work together."],["Embodiment of engineering and research results","The practical implementation of research findings in working robotic systems."],["Open dependable system","A system intended to support interoperability while maintaining reliable operation."],["Interconnectivity","The ability of devices or systems to connect and exchange information."],["Sustainable manufacturing","Production that reduces resource consumption, waste, and environmental impact."],["Robot synchronization","The coordination of robots' actions and timing."],["Multi-robot system","A group of robots that operate together or share a working environment."],["Robot networking","The connection of robots to exchange data or coordinate control and maintenance."],["Microprocessor","An electronic processor that executes computational instructions."],["Computational power","The capacity of a system to process information and perform calculations."],["Moore's law","The historical observation that the number of transistors on integrated circuits tends to double approximately every two years."],["Vision system","A combination of sensors and software used to obtain and interpret visual information."],["Cybersecurity","The protection of robotic systems, networks, and data against unauthorized access or attacks."],["Remote control","The operation of a robot from another location through a communication connection."]],
"Chapter 8: Generations":[["Robotics 1.0","The first generation of robotics, focused on repetitive industrial automation in structured environments."],["4Ds","Dull, dirty, dumb, and dangerous; the lesson's description of tasks associated with Robotics 1.0."],["Robotics 2.0","The generation characterised by improved intelligence, sensing, safety, mobility, and ease of use."],["Personal robot","A robot intended to assist individual users, associated in the lesson with second-generation robotics."],["4Ss","Smarter, safer, sensors, and simple; the lesson's description of the transition to Robotics 2.0."],["Robotics 3.0","The emerging vision of connected, context-aware robots that interact with people and perform complex tasks autonomously."],["4Ms","Multitasking, emotive, morphing, and multiagent systems; the lesson's description of Robotics 3.0."],["Multitasking","The ability to manage or perform multiple tasks."],["Emotive robotics","Robotics involving the recognition, expression, or simulation of emotional signals."],["Morphing","The ability to change physical shape or configuration."],["Multiagent system","A system containing multiple agents that interact, coordinate, or cooperate."],["Context awareness","The ability to use information about the current situation to choose appropriate actions."],["Ubiquitous robotics","Robotics in which robots are widely present and exchange information with other robots and surrounding devices."],["Networked robot","A robot connected to other robots or systems through a communication network."],["Cloud robotics","The use of remote computing resources, shared data, and network services to support robots."],["Cloud computing infrastructure","Remote computing and storage resources accessed through a network."],["Computation offloading","The transfer of computational work from a robot to another computer or cloud service."],["Social awareness","The ability to recognise people, social situations, and relevant social expectations."],["Affective interaction","Interaction involving emotional signals or responses."],["Ubirobots' engineering","The design and integration of robots within interconnected, ubiquitous environments."]],
"Chapter 9: Robot Types":[["Humanoid robot","A robot whose physical structure resembles the human body."],["ASIMO","A humanoid robot developed by Honda."],["Social robot","A robot designed to interact socially with people."],["Service robot","A robot that performs useful tasks for people or equipment outside industrial automation."],["Pepper","A social robot used in the lesson as an example of speech- and gesture-based human interaction."],["Wearable robotics","The field of robotic devices worn on the body to assist, restore, or enhance human abilities."],["Exoskeleton","An external wearable structure that supports or assists body movements."],["Exosuit","A wearable assistive device that mainly uses soft structures to support movement."],["Wearable user interface","A body-worn device used to send commands to or receive feedback from a robotic system."],["Rehabilitation robotics","The use of robotic systems to help people recover or practise physical abilities."],["Walking assist system","A device that supports a person's walking movements."],["Robotic prosthesis","An artificial body part using robotic mechanisms or control to replace lost function."],["Soft robotics","The field concerned with robots made partly or mainly from flexible, deformable materials."],["Soft robot","A robot whose flexible components allow substantial deformation during operation."],["Rigid body","An idealised object whose shape and internal distances do not change."],["Deformation","A change in an object's shape or size."],["Pneumatic control","The use of pressurized gas to produce or regulate movement."],["Hydraulic control","The use of pressurized liquid to produce or regulate movement."],["Bio-inspired robotics","The design of robots using principles or solutions found in living organisms."],["Bio-inspired robot","A robot whose design or behaviour draws inspiration from biological systems."]],
"Chapter 10: AI & Perception":[["Artificial intelligence (AI)","Computational methods that enable machines to perform tasks involving perception, reasoning, planning, or learning."],["Autonomy","The ability to perform tasks and make operational decisions without continuous human control."],["Adaptability","The ability to adjust behaviour to new tasks or changing conditions."],["Structured environment","An environment whose layout and operating conditions are relatively predictable."],["Unstructured environment","An environment that is variable and not fully arranged or known in advance."],["Dynamic environment","An environment that changes while a robot operates."],["Robotic perception","The process of interpreting sensor data to understand the robot and its surroundings."],["Computer vision","Methods that extract useful information from images or video."],["Pattern recognition","The identification of meaningful patterns in data."],["Object detection","The identification and location of objects in sensor data, especially images."],["Object recognition","The identification of what an observed object is."],["Image classification","The assignment of an image or image region to a category."],["Scene understanding","The interpretation of objects, relationships, and activities within an environment."],["Spatial relationship","The position or orientation of one object relative to another."],["Semantic information","Information about what objects or observations mean."],["Semantic perception","The interpretation of sensor data in terms of meaningful objects, categories, and relationships."],["Lidar","A sensing technology that measures distance using laser light."],["Sonar","A sensing technology that detects objects or measures distance using sound waves."],["Touch sensor","A device that detects physical contact or related quantities such as pressure."],["Tactile feedback","Information obtained through physical contact."],["Depth sensor","A sensor that measures distances to surfaces or objects."],["Sensor fusion","The combination of information from multiple sensors to obtain a more reliable estimate."],["Multimodal perception","The combined interpretation of different types of sensory input, such as vision, sound, and touch."],["Simultaneous localization and mapping (SLAM)","The process of building a map while estimating the robot's location within it."],["Loop closure","The recognition that a robot has returned to a previously visited place, allowing mapping and localization errors to be corrected."],["Probabilistic AI","AI methods that represent and reason about uncertainty using probabilities."],["Bayesian estimation","The updating of an estimate by combining prior knowledge with new evidence."],["Natural language processing (NLP)","Methods that allow computers to process and interpret human language."],["Speech recognition","The conversion of spoken language into a machine-processable representation."],["Gesture recognition","The identification and interpretation of body or hand movements."],["Facial expression recognition","The identification of facial movements associated with expressions."]],
"Chapter 11: Decision & Planning":[["Decision-making","The selection of actions based on goals, available information, and possible outcomes."],["Planning","The process of determining actions needed to achieve a goal."],["Motion planning","The computation of feasible robot movements that achieve a task while respecting constraints."],["Path planning","The computation of a route from a starting point to a destination."],["Collision-free trajectory","A sequence of movements over time that avoids contact with obstacles."],["Search space","The set of possible states or solutions explored by an algorithm."],["Graph search","A method that explores connected states to find a route or solution."],["Sampling-based planner","A motion-planning method that samples possible configurations and attempts to connect them into a feasible path."],["Optimization","The process of finding the best solution according to a defined objective and constraints."],["Heuristic","A practical estimate or rule that guides a search toward promising solutions."],["Autonomous navigation","The ability to determine and follow routes without continuous human guidance."],["Obstacle avoidance","The adjustment of movement to prevent collisions."],["High-level planning","The selection and ordering of broader actions needed to complete a task."],["Automated planning","The automatic generation of action sequences from descriptions of goals and available actions."],["Symbolic AI","AI that uses explicit symbols, rules, and logical representations."],["Symbolic planner","A planning system that uses symbolic descriptions of actions, conditions, and goals."],["Reasoning","The use of available knowledge to draw conclusions or choose actions."],["Replanning","The revision of a plan when conditions or information change."],["Task allocation","The assignment of tasks to robots or other agents."],["Coordination","The organisation of actions so that multiple robots or agents work effectively together."],["Control law","A rule that determines control commands from a system's state and desired behaviour."],["Controller","A component that calculates commands to guide a system toward desired behaviour."],["Adaptive control","Control that adjusts its parameters in response to changes or uncertainty."],["Intelligent control","Control that uses AI methods to select or improve actions."],["Learning-based controller","A controller whose behaviour is learned from data or experience."],["Control policy","A rule or strategy that maps observations or states to actions."],["Dynamics","The study of motion in relation to forces and torques."],["Gait","A coordinated pattern of movements used for walking or other locomotion."],["Predictive model","A model used to estimate future states or outcomes."],["Decision network","A model representing relationships among uncertain events, decisions, and their consequences."],["Game-theoretic planning","Planning that considers how other decision-makers may act."],["Cognitive architecture","An integrated framework connecting perception, memory, reasoning, planning, and learning."],["Knowledge base","An organised collection of information used for reasoning and decision-making."],["Human-robot interaction","The ways people and robots communicate and respond to one another."],["Human-robot collaboration","People and robots working together toward a shared goal."]],
"Chapter 12: Machine Learning":[["Machine learning (ML)","Methods that enable a system to improve or acquire capabilities through data and experience."],["Supervised learning","Learning from examples that include the correct labels or outputs."],["Unsupervised learning","Learning patterns or structure from data without provided target labels."],["Reinforcement learning (RL)","Learning through interaction by selecting actions and using rewards to improve future behaviour."],["Deep learning","Machine learning using neural networks with multiple processing layers."],["Neural network","A computational model made of connected processing units whose parameters are adjusted during learning."],["Deep neural network","A neural network containing multiple layers that learn increasingly complex representations."],["Convolutional neural network (CNN)","A neural network architecture especially suited to processing images and other grid-like data."],["Deep reinforcement learning","Reinforcement learning that uses deep neural networks to represent policies or other learned functions."],["Training data","Examples or experiences used to adjust a machine-learning model."],["Labeled data","Data paired with information specifying the desired category or output."],["Feature learning","The automatic discovery of useful representations from data."],["Generalization","The ability to apply learned knowledge to new examples or situations."],["Trial-and-error learning","Learning by attempting actions and using their outcomes to improve."],["Reward","A numerical feedback signal indicating how desirable an outcome or action is."],["Penalty","Negative feedback that discourages an action or outcome."],["Cumulative reward","The total reward collected over a sequence of interactions, sometimes weighted by time."],["Learning from demonstration","Learning how to perform a task from examples provided by a human or another robot."],["Imitation learning","Learning a policy by reproducing or generalizing demonstrated behaviour."],["Online learning","Updating a model while new data arrive during operation."],["Calibration","The adjustment of system parameters so that measurements or actions match relevant references."],["Learning-based calibration","The use of learning methods to adjust a robot's parameters from data or feedback."],["Simulation","A computer-based representation of a robot and its environment used for testing or training."],["Simulator","Software that reproduces relevant aspects of a physical system and its behaviour."],["Sim-to-real transfer","The application of knowledge or behaviours learned in simulation to a physical robot."],["Big data","Large or complex datasets used to support analysis and learning."],["Collective learning","Learning in which experience or knowledge is shared among multiple robots."],["Robot fleet","A group of robots managed or operated together."],["Black-box system","A system whose internal decision process is difficult to inspect or understand."],["Explainability","The ability to provide understandable reasons for a system's outputs or actions."],["Trust in robots","Confidence that a robot will behave reliably and appropriately."],["Safety constraint","A restriction intended to prevent unsafe actions or outcomes."],["Robot locomotion","The movement of a robot from one place to another."],["Robotic manipulation","The controlled movement and handling of objects."],["Robotic grasping","The process of securing and holding an object with a robotic hand or gripper."],["Multi-agent reinforcement learning","Reinforcement learning involving multiple interacting agents."],["Lifelong learning","The continued acquisition and refinement of knowledge or skills throughout operation."]]
};

const chs=Object.keys(D);
let ci=0,ti=0,rot=300,rotT=null,notif='none';
let pTotal=25*60,pLeft=25*60,pRun=false,pT=null,actx=null;

function getImgIndex(){let idx=0;for(let i=0;i<ci;i++)idx+=CHSIZES[i];return idx+ti;}

function beep(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);o.frequency.value=880;o.type='sine';g.gain.value=.25;
  o.start();o.stop(actx.currentTime+.12);
  setTimeout(()=>{const o2=actx.createOscillator(),g2=actx.createGain();o2.connect(g2);g2.connect(actx.destination);o2.frequency.value=1100;o2.type='sine';g2.gain.value=.25;o2.start();o2.stop(actx.currentTime+.15);},150);
}
function doAlert(){if(notif==='sound')beep();if(notif==='vibration'&&navigator.vibrate)navigator.vibrate([80,40,80]);}

function playWhiteAnim(cb){
  const ov=document.getElementById('animWhite'),v=document.getElementById('animWhiteVideo');
  const count=Math.random()<.4?2:1;let played=0;
  function go(){v.src=nextWhiteAnim();ov.classList.add('show');v.play();v.onended=()=>{played++;if(played<count)go();else{ov.classList.remove('show');if(cb)cb();}};}
  go();
}
function playGreenAnim(cb){
  const ov=document.getElementById('animGreen'),v=document.getElementById('animGreenVideo');
  v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];ov.classList.add('show');v.play();
  v.onended=()=>{ov.classList.remove('show');if(cb)cb();};
}

function showPomodoroDone(){
  const ov=document.getElementById('pomodoroOverlay'),v=document.getElementById('pomodoroVideo');
  v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];ov.classList.add('show');v.play();
  v.onended=()=>{v.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];v.play();};
}
function dismissPomodoro(){document.getElementById('pomodoroOverlay').classList.remove('show');document.getElementById('pomodoroVideo').pause();}

// Build chapter buttons (only chapters that have data)
function buildChapters(){
  // For now only Chapter 1 has content
  const available=[0]; // indexes of chapters with data, add more later
  document.getElementById('csChapters').innerHTML=available.map(i=>
    `<button class="cs-ch-btn" onclick="openChapter(${i})"><span class="num">${i+1}</span>${CHNAMES[i]}</button>`
  ).join('');
}

// Mascot: sits still, occasionally plays animation
let mascotIdx=0,mascotTimer=null;
function startMascot(){
  scheduleMascotAnim();
}
function scheduleMascotAnim(){
  const delay=8000+Math.random()*15000; // 8-23 seconds
  mascotTimer=setTimeout(()=>{
    const v=document.getElementById('mascotVideo');
    v.src=whiteAnims[mascotIdx%whiteAnims.length];
    mascotIdx++;
    v.classList.add('playing');
    v.play();
    v.onended=()=>{v.classList.remove('playing');scheduleMascotAnim();};
  },delay);
}
function stopMascot(){
  if(mascotTimer)clearTimeout(mascotTimer);
  const v=document.getElementById('mascotVideo');
  v.pause();v.classList.remove('playing');v.onended=null;
}

function openChapter(i){
  ci=i;ti=0;
  playGreenAnim(()=>{
    document.getElementById('chaptersScreen').classList.remove('active');
    document.getElementById('termScreen').classList.add('active');
    renderTerm();
    resetRot();
    startMascot();
  });
}

function goBack(){
  if(rotT)clearInterval(rotT);
  stopMascot();
  document.getElementById('termScreen').classList.remove('active');
  document.getElementById('chaptersScreen').classList.add('active');
}

function renderTerm(){
  const ts=D[chs[ci]],[t,d]=ts[ti];
  const r=document.getElementById('termRight');
  r.classList.remove('fade');void r.offsetWidth;r.classList.add('fade');
  document.getElementById('termCh').textContent=chs[ci];
  document.getElementById('termImg').src='img/'+IMGS[getImgIndex()];
  document.getElementById('termWord').textContent=t;
  document.getElementById('termDef').textContent=d;
  document.getElementById('termCount').textContent=`${ti+1} / ${ts.length}`;
  document.getElementById('termProg').style.width=`${((ti+1)/ts.length)*100}%`;
}

function nextTerm(){ti=(ti+1)%D[chs[ci]].length;renderTerm();doAlert();resetRot();}
function prevTerm(){ti=(ti-1+D[chs[ci]].length)%D[chs[ci]].length;renderTerm();doAlert();resetRot();}
function autoNext(){ti=(ti+1)%D[chs[ci]].length;playWhiteAnim(()=>{renderTerm();doAlert();});}
function resetRot(){if(rotT)clearInterval(rotT);rotT=setInterval(autoNext,rot*1000);}

function setNotif(m){notif=m;updateNotifIcon();if(m==='sound')beep();if(m==='vibration'&&navigator.vibrate)navigator.vibrate(80);}
function cycleNotif(){const modes=['none','sound','vibration'];notif=modes[(modes.indexOf(notif)+1)%3];setNotif(notif);}
function updateNotifIcon(){const on=notif!=='none';document.getElementById('notifIconOff').style.display=on?'none':'block';document.getElementById('notifIconOn').style.display=on?'block':'none';document.getElementById('notifToggle').classList.toggle('active',on);document.getElementById('notifToggle').title=notif==='none'?'Alerts off':notif==='sound'?'Sound on':'Vibrate on';}
function setRot(s){rot=s;document.querySelectorAll('.rot-pill').forEach(b=>b.classList.toggle('on',+b.dataset.i===s));if(rotT)resetRot();}

function fmt(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
const timerPresets=[10,15,25,30,45,60];let tpIdx=2;
function cycleTimerPreset(){if(pRun)return;tpIdx=(tpIdx+1)%timerPresets.length;setTimer(timerPresets[tpIdx]);}
function setTimer(m){pTotal=m*60;pLeft=m*60;pRun=false;if(pT)clearInterval(pT);document.getElementById('startBtn').textContent='Start';document.getElementById('termTimer').classList.remove('done');document.getElementById('termTimer').textContent=fmt(pLeft);}
function toggleTimer(){
  if(pRun){pRun=false;clearInterval(pT);document.getElementById('startBtn').textContent='Start';}
  else{pRun=true;document.getElementById('startBtn').textContent='Pause';
    pT=setInterval(()=>{pLeft--;document.getElementById('termTimer').textContent=fmt(pLeft);
      if(pLeft<=0){clearInterval(pT);pRun=false;document.getElementById('startBtn').textContent='Start';
        document.getElementById('termTimer').classList.add('done');beep();
        if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);showPomodoroDone();}
    },1000);}
}
function resetTimer(){pRun=false;if(pT)clearInterval(pT);pLeft=pTotal;document.getElementById('startBtn').textContent='Start';document.getElementById('termTimer').classList.remove('done');document.getElementById('termTimer').textContent=fmt(pLeft);}

// Keyboard nav
document.addEventListener('keydown',e=>{
  if(!document.getElementById('termScreen').classList.contains('active'))return;
  if(e.key==='ArrowRight'||e.key===' ')nextTerm();
  if(e.key==='ArrowLeft')prevTerm();
  if(e.key==='Escape')goBack();
});

buildChapters();
</script>
</body>
