<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meowbot</title>
<link rel="icon" href="meowbot.png" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;color:#111;min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;background:#fff}
  .app{width:100%;max-width:480px;padding:48px 24px 120px}

  .logo{display:flex;align-items:center;gap:10px;margin-bottom:48px}
  .logo img{width:32px;height:32px;border-radius:8px}
  .logo span{font-size:15px;font-weight:700;letter-spacing:-0.3px}

  /* Pomodoro */
  .timer-section{margin-bottom:48px}
  .timer-display{font-size:72px;font-weight:200;letter-spacing:-4px;line-height:1;margin-bottom:20px;font-variant-numeric:tabular-nums}
  .timer-display.done{color:#00c853}
  .timer-presets{display:flex;gap:6px;margin-bottom:16px}
  .pill{background:none;border:1.5px solid #ddd;border-radius:100px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:#999;transition:all .2s}
  .pill:hover{border-color:#111;color:#111}
  .pill.on{background:#111;color:#fff;border-color:#111}
  .timer-actions{display:flex;gap:8px}
  .btn{background:#00c853;color:#fff;border:none;border-radius:100px;padding:10px 28px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s}
  .btn:hover{opacity:.85}
  .btn.ghost{background:none;color:#999;padding:10px 16px}
  .btn.ghost:hover{color:#111}

  .divider{height:1px;background:#e8e8e8;margin-bottom:32px}

  /* Chapters */
  .chapters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:32px;padding-bottom:2px}
  .chapters::-webkit-scrollbar{display:none}
  .ch{flex-shrink:0;background:none;border:none;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:#bbb;border-radius:100px;transition:all .15s;white-space:nowrap}
  .ch:hover{color:#111}
  .ch.on{background:#00c853;color:#fff}

  /* Settings */
  .settings{display:flex;gap:24px;margin-bottom:40px;flex-wrap:wrap}
  .setting-group{display:flex;align-items:center;gap:8px}
  .setting-label{font-size:11px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:.8px}
  .setting-pills{display:flex;gap:4px}
  .sp{background:none;border:1px solid transparent;border-radius:100px;padding:4px 10px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;color:#bbb;transition:all .15s}
  .sp:hover{color:#111}
  .sp.on{background:#eafff0;color:#00c853;border-color:#b9f6ca}

  /* Animation overlays */
  .anim-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
  .anim-overlay.show{opacity:1;pointer-events:auto}
  .anim-overlay video{max-width:320px;max-height:320px;border-radius:24px}
  .anim-overlay.white{background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .anim-overlay.green{background:rgba(0,200,83,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

  /* Term card */
  .term-area{margin-bottom:24px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .term-chapter{font-size:11px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin-bottom:20px;align-self:flex-start}
  .term-illustration{width:160px;height:160px;object-fit:contain;margin-bottom:20px;border-radius:12px}
  .term-word{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.2;margin-bottom:12px;color:#00c853;text-align:center}
  .term-def{font-size:16px;font-weight:400;line-height:1.65;color:#555;text-align:center}
  .term-meta{display:flex;align-items:center;justify-content:space-between;margin-top:24px;width:100%}
  .term-count{font-size:12px;color:#ccc;font-weight:500;font-variant-numeric:tabular-nums}
  .progress-track{flex:1;height:2px;background:#e8e8e8;border-radius:1px;margin-left:12px;overflow:hidden}
  .progress-fill{height:100%;background:#00c853;border-radius:1px;transition:width .3s}

  .skip{width:100%;background:none;border:1.5px solid #e8e8e8;border-radius:12px;padding:14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#999;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
  .skip:hover{border-color:#00c853;color:#00c853}
  .skip svg{transition:transform .2s}
  .skip:hover svg{transform:translateX(2px)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeUp .25s ease}

  .mascot{position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;overflow:hidden;box-shadow:0 2px 16px rgba(0,200,83,.25);animation:float 3s ease-in-out infinite}
  .mascot img{width:100%;height:100%;object-fit:cover}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* Green overlay for chapters/pomodoro done */
  .green-overlay{position:fixed;inset:0;background:#00c853;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
  .green-overlay.show{opacity:1;pointer-events:auto}
  .green-overlay .green-title{color:#fff;font-size:24px;font-weight:700;margin-bottom:8px}
  .green-overlay .green-sub{color:rgba(255,255,255,.7);font-size:14px;font-weight:500;margin-bottom:32px}
  .green-overlay .green-dismiss{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:100px;padding:10px 28px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;backdrop-filter:blur(10px);transition:background .2s}
  .green-overlay .green-dismiss:hover{background:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div class="app">
  <div class="logo"><img src="meowbot.png" alt=""><span>meowbot</span></div>

  <div class="timer-section">
    <div class="timer-display" id="timerDisplay">25:00</div>
    <div class="timer-presets">
      <button class="pill" onclick="setTimer(10)">10m</button>
      <button class="pill" onclick="setTimer(15)">15m</button>
      <button class="pill on" onclick="setTimer(25)">25m</button>
      <button class="pill" onclick="setTimer(30)">30m</button>
      <button class="pill" onclick="setTimer(45)">45m</button>
      <button class="pill" onclick="setTimer(60)">60m</button>
    </div>
    <div class="timer-actions">
      <button class="btn" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn ghost" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <div class="divider"></div>
  <div class="chapters" id="chapters"></div>

  <div class="settings">
    <div class="setting-group">
      <span class="setting-label">Alert</span>
      <div class="setting-pills">
        <button class="sp on" data-n="none" onclick="setNotif('none')">None</button>
        <button class="sp" data-n="sound" onclick="setNotif('sound')">Sound</button>
        <button class="sp" data-n="vibration" onclick="setNotif('vibration')">Vibrate</button>
      </div>
    </div>
    <div class="setting-group">
      <span class="setting-label">Rotate</span>
      <div class="setting-pills">
        <button class="sp" data-i="60" onclick="setRot(60)">1m</button>
        <button class="sp" data-i="120" onclick="setRot(120)">2m</button>
        <button class="sp on" data-i="300" onclick="setRot(300)">5m</button>
        <button class="sp" data-i="600" onclick="setRot(600)">10m</button>
      </div>
    </div>
  </div>

  <div class="term-area" id="termArea">
    <div class="term-chapter" id="termCh"></div>
    <img class="term-illustration" id="termImg" src="" alt="">
    <div class="term-word" id="termWord"></div>
    <div class="term-def" id="termDef"></div>
    <div class="term-meta">
      <span class="term-count" id="termCount"></span>
      <div class="progress-track"><div class="progress-fill" id="termProg"></div></div>
    </div>
  </div>

  <button class="skip" onclick="nextTerm()">
    Next
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>
</div>

<!-- White overlay for term transitions -->
<div class="anim-overlay white" id="animWhite">
  <video id="animWhiteVideo" muted playsinline></video>
</div>

<!-- Green overlay for chapter switch + pomodoro done -->
<div class="anim-overlay green" id="animGreen">
  <video id="animGreenVideo" muted playsinline></video>
</div>

<!-- Green screen for pomodoro done -->
<div class="green-overlay" id="pomodoroOverlay">
  <video id="pomodoroVideo" muted playsinline style="max-width:240px;max-height:240px;border-radius:24px;margin-bottom:24px"></video>
  <div class="green-title">Time's up!</div>
  <div class="green-sub">Great study session</div>
  <button class="green-dismiss" onclick="dismissPomodoro()">Continue</button>
</div>

<div class="mascot"><img src="meowbot.png" alt=""></div>

const chs=Object.keys(D);
let ci=0,ti=0,rot=300,rotT=null,notif='none';
let pTotal=25*60,pLeft=25*60,pRun=false,pT=null,actx=null;

function getImgIndex(){let idx=0;for(let i=0;i<ci;i++)idx+=CHSIZES[i];return idx+ti;}

function beep(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);o.frequency.value=880;o.type='sine';g.gain.value=.25;
  o.start();o.stop(actx.currentTime+.12);
  setTimeout(()=>{const o2=actx.createOscillator(),g2=actx.createGain();o2.connect(g2);g2.connect(actx.destination);o2.frequency.value=1100;o2.type='sine';g2.gain.value=.25;o2.start();o2.stop(actx.currentTime+.15);},150);
}

function doAlert(){
  if(notif==='sound')beep();
  if(notif==='vibration'&&navigator.vibrate)navigator.vibrate([80,40,80]);
}

// Play white animation(s) - sometimes 1, sometimes 2 back-to-back
function playWhiteAnim(cb){
  const overlay=document.getElementById('animWhite');
  const video=document.getElementById('animWhiteVideo');
  const count=Math.random()<0.4?2:1; // 40% chance of playing 2
  let played=0;
  function playOne(){
    video.src=nextWhiteAnim();
    overlay.classList.add('show');
    video.play();
    video.onended=()=>{
      played++;
      if(played<count){playOne();}
      else{overlay.classList.remove('show');if(cb)cb();}
    };
  }
  playOne();
}

// Play green animation
function playGreenAnim(cb){
  const overlay=document.getElementById('animGreen');
  const video=document.getElementById('animGreenVideo');
  video.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];
  overlay.classList.add('show');
  video.play();
  video.onended=()=>{overlay.classList.remove('show');if(cb)cb();};
}

// Pomodoro done - green screen with animation
function showPomodoroDone(){
  const overlay=document.getElementById('pomodoroOverlay');
  const video=document.getElementById('pomodoroVideo');
  video.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];
  overlay.classList.add('show');
  video.play();
  video.onended=()=>{video.src=greenAnims[Math.floor(Math.random()*greenAnims.length)];video.play();};
}

function dismissPomodoro(){
  const overlay=document.getElementById('pomodoroOverlay');
  const video=document.getElementById('pomodoroVideo');
  overlay.classList.remove('show');
  video.pause();
}

function renderChs(){
  document.getElementById('chapters').innerHTML=chs.map((c,i)=>{
    const l=c.replace('Chapter ','').split(':')[0];
    return `<button class="ch${i===ci?' on':''}" onclick="selCh(${i})">${l}</button>`;
  }).join('');
}

function selCh(i){
  if(i===ci){return;}
  const prev=ci;
  ci=i;ti=0;
  renderChs();
  // Green animation for chapter switch
  playGreenAnim(()=>{renderTerm();});
}

function renderTerm(){
  const ts=D[chs[ci]],[t,d]=ts[ti],a=document.getElementById('termArea');
  a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade');
  document.getElementById('termCh').textContent=chs[ci];
  document.getElementById('termImg').src='img/'+IMGS[getImgIndex()];
  document.getElementById('termWord').textContent=t;
  document.getElementById('termDef').textContent=d;
  document.getElementById('termCount').textContent=`${ti+1} / ${ts.length}`;
  document.getElementById('termProg').style.width=`${((ti+1)/ts.length)*100}%`;
}

function nextTerm(){
  ti=(ti+1)%D[chs[ci]].length;
  renderTerm();doAlert();resetRot();
}

function autoNext(){
  ti=(ti+1)%D[chs[ci]].length;
  playWhiteAnim(()=>{renderTerm();doAlert();});
}

function resetRot(){
  if(rotT)clearInterval(rotT);
  rotT=setInterval(autoNext,rot*1000);
}

function setNotif(m){
  notif=m;
  document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',b.dataset.n===m));
  if(m==='sound')beep();
  if(m==='vibration'&&navigator.vibrate)navigator.vibrate(80);
}

function setRot(s){
  rot=s;
  document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===s));
  resetRot();
}

function fmt(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

function setTimer(m){
  pTotal=m*60;pLeft=m*60;pRun=false;if(pT)clearInterval(pT);
  document.getElementById('startBtn').textContent='Start';
  document.getElementById('timerDisplay').classList.remove('done');
  document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',parseInt(b.textContent)===m));
  document.getElementById('timerDisplay').textContent=fmt(pLeft);
}

function toggleTimer(){
  if(pRun){pRun=false;clearInterval(pT);document.getElementById('startBtn').textContent='Start';}
  else{pRun=true;document.getElementById('startBtn').textContent='Pause';
    pT=setInterval(()=>{pLeft--;document.getElementById('timerDisplay').textContent=fmt(pLeft);
      if(pLeft<=0){clearInterval(pT);pRun=false;document.getElementById('startBtn').textContent='Start';
        document.getElementById('timerDisplay').classList.add('done');
        beep();if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
        showPomodoroDone();
      }
    },1000);}
}

function resetTimer(){
  pRun=false;if(pT)clearInterval(pT);pLeft=pTotal;
  document.getElementById('startBtn').textContent='Start';
  document.getElementById('timerDisplay').classList.remove('done');
  document.getElementById('timerDisplay').textContent=fmt(pLeft);
}

renderChs();renderTerm();resetRot();
</script>
